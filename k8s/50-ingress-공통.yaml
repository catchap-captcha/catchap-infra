# ★★도메인 → 서비스 연결. 옛 구조에서 Caddy 가 하던 일을 여기가 대신한다.
#
# ★루트 → www 는 별도 Ingress 가 아니라 www 쪽 annotation 하나로 처리한다(아래 ①).
#
# ★서비스별 폴더가 아니라 여기 한 곳에 둔 이유
#   `www.catchap5.com` 하나에 프론트와 백엔드가 **경로로 갈려** 붙는다.
#   두 파일로 나누면 같은 host 규칙이 두 군데에 흩어져, 나중에 한쪽만 고치는 사고가 난다.
#   캡차는 host 가 달라서(`captcha.catchap5.com`) 그쪽 폴더에 그대로 둔다.
#
# ✅0804 적용 완료. 실측:
#   catchap5.com/courses/3?tab=notes  →  308  www.catchap5.com/courses/3?tab=notes
#   www.catchap5.com/courses/3        →  200  (리다이렉트 없음)
#   api.catchap5.com/                 →  503  (백엔드가 아직 없음)
#
# ⚠️DNS 는 **백엔드까지 올라간 뒤에** 옮긴다. 순서를 바꾸면 접속이 끊긴다.
# ── ① www — 프론트가 기본, /api 만 백엔드로
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www
  namespace: catchap
  labels:
    app.kubernetes.io/name: frontend
  annotations:
    # ★★루트(catchap5.com) → www 로 301. **경로를 그대로 이어 준다.**
    #   처음엔 별도 Ingress + permanent-redirect 로 만들었는데
    #   그 방식은 $request_uri 같은 변수를 못 써서 경로가 사라졌다(실측: /courses/3 → /).
    #   ingress-nginx 에 이 목적의 정식 설정이 있어서 그걸로 바꿨다.
    #   configuration-snippet 을 켜지 않아도 된다 — 그건 클러스터 전체에 열려 위험하다.
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    # ★영상 업로드가 있어 본문 크기 제한을 올린다. 기본 1MB 로는 바로 413 이 난다.
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    # ★큰 파일 업로드/자막 생성 대기 때문에 타임아웃도 올린다.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: www.catchap5.com
      http:
        paths:
          # ★★순서가 아니라 **길이**로 이긴다. nginx 인그레스는 더 긴 경로를 먼저 고른다.
          #   그래서 /api 가 / 보다 먼저 매칭된다.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# ── ①-b www.catchap5.com/captcha-api/* — 캡차 (★옛 환경과 동등하게 맞추는 것)
#
# 【왜 별도 Ingress 인가 — ★같은 파일에 두되 객체는 나눈다】
#   접두사를 떼려면 `rewrite-target` 이 필요한데, 이 annotation 은 ★Ingress 객체 전체에
#   걸린다. ①(www)에 붙이면 `/api` 와 `/` 까지 다시 써져 ★사이트 전체가 깨진다.
#   그래서 객체만 분리하고, 파일은 ①과 같은 곳에 둔다(같은 host 규칙을 흩지 않기 위해).
#
# 【무엇을 흉내 내는가 — 옛 환경 Caddyfile】
#   handle_path /captcha-api/* { reverse_proxy 10.0.1.52:8000 }
#   ★`handle_path` 는 접두사를 ★뗀다. 그래서 여기서도 떼야 한다.
#
# ⚠️★안 떼면 증상이 「붙이기 전」과 똑같다 — 캡차 앱이 자기 SPA 폴백 HTML 을
#    ★200 으로 돌려준다. 404 가 아니라서 ★조용히 깨진다.
#      /captcha-api/api/config  안 떼면 → 200 ★text/html
#                               떼면    → 200 application/json
#    ★그래서 검증은 상태코드가 아니라 ★content-type 으로 한다.
#
# 【왜 넣는가 — 지금 쓰는 곳을 못 찾았는데도】
#   · 새 환경 백엔드는 ★이 경로가 필요 없다
#       MAIN_CAPTCHA_URL = http://captcha-api.catchap.svc.cluster.local:8000 (내부 주소)
#       옛 환경은 https://www.catchap5.com/captcha-api 였다
#   · 프론트 번들 5개 전부 뒤졌지만 참조 ★0건
#   · ⚠️그런데 ★쓰는 곳이 없다고 확인하지는 ★못했다 —
#       옛 Caddy 는 접근 로그가 ★꺼져 있고(Caddyfile 에 log 지시어 없음),
#       handle_path 가 접두사를 떼서 ★캡차 앱 로그로도 두 경로를 구분할 수 없다.
#       "로그에 0건" 은 측정이 아니라 ★측정기가 없는 것이다.
#   · 옛 Caddyfile 주석에 "하위경로 /captcha-api 는 ★서버검증용으로만 유지" 라고
#     적혀 있다 = 누군가 의도적으로 남긴 경로다.
#   ★그래서 「없는 것을 확인」이 아니라 ★「옛 환경과 동등」을 택했다.
#     컷오버에서 모르는 것을 줄이는 쪽이 맞다. 필요 없어지면 이 블록만 지우면 된다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-captcha-api
  namespace: catchap
  labels:
    app.kubernetes.io/name: captcha
  annotations:
    # ★$2 = 아래 정규식의 두 번째 괄호 = 접두사를 뗀 나머지 경로
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: www.catchap5.com
      http:
        paths:
          # ★(/|$)(.*) 형태여야 /captcha-api 와 /captcha-api/ 둘 다 잡힌다.
          #   pathType 은 정규식을 쓰므로 ImplementationSpecific 이어야 한다.
          - path: /captcha-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: captcha-api
                port:
                  name: http
---
# ── ② api.catchap5.com — 백엔드 전용
#
# ★www/api 와 별도로 두는 이유 — 지금 프론트 코드에 API 주소가 **빌드 시점에 박혀** 있다.
#   그 값이 무엇인지에 따라 둘 중 하나만 쓰이는데, **둘 다 열어 두면 어느 쪽이든 동작한다.**
#   ⚠️정리는 프론트를 다시 구울 때 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: catchap
  labels:
    app.kubernetes.io/name: backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: api.catchap5.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  name: http
