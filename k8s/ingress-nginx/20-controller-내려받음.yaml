# ingress-nginx 컨트롤러 본체 — ★살아 있는 것을 그대로 내려받은 것 (2026-08-10)
#
# ★왜 이 파일이 필요한가
#   이 폴더에는 설정 ConfigMap 만 있었고 ★컨트롤러 본체는 git 어디에도 없었다.
#   클러스터를 다시 만들어야 하면 「어떻게 깔았더라」를 아무도 모른다.
#
# ★★그리고 우리 설치는 ★원본과 크게 다르다 — 원본을 받아 비교했다.
#
#   원본 (controller-v1.14.5 · cloud·baremetal 둘 다)
#       kind: Deployment · hostNetwork 언급 ★0회 · Service LoadBalancer(cloud)/NodePort(baremetal)
#
#   ★우리
#       kind: ★DaemonSet             노드마다 한 벌 — 모든 노드가 80·443 을 직접 받는다
#       hostNetwork: ★true           그래서 파드 IP = 노드 IP 다
#       dnsPolicy: ClusterFirstWithHostNet
#       Service: ★ClusterIP          바깥 노출은 로드밸런서가 ★노드를 직접 가리켜서 한다
#
#   ★원본 매니페스트만으로는 ★절대 재현되지 않는다. 그래서 이 파일을 둔다.
#
# ⚠️★hostNetwork 가 만드는 결과 (다른 작업에 영향을 준다)
#   · 출발지가 파드가 아니라 ★호스트라서, NetworkPolicy 의 `namespaceSelector` 로
#     「인그레스에서 온 것」을 고를 수 ★없다. (0810 에 실제로 걸려 되돌렸다 —
#      `k8s/75-networkpolicy-공통.yaml` 과 `30-작업이력/84-…` 참고)
#   · Calico 가 IPIP 터널을 써서, 받는 쪽이 보는 출발지는 노드 IP 가 아니라
#     ★터널 주소(192.168.x)다.
#
# ─────────────────────────────────────────────────────────────
# ⚠️★이 파일에 ★없는 것 — 설치할 때 새로 만들어진다
#
#   secret/ingress-nginx-admission        웹훅용 TLS 인증서·키
#   webhook 의 caBundle                    위 인증서의 공개부
#
#   ★일부러 뺐다. 비밀값을 git 에 두지 않는다.
#   원본 매니페스트의 `ingress-nginx-admission-create`·`-patch` Job 이 이것을 만들고
#   웹훅에 채워 넣는다. 새로 설치할 때는 ★원본에서 그 Job 두 개를 같이 적용해야 한다.
#
# ⚠️★이 파일은 ArgoCD 가 보지 않는다. 지금 도는 것을 다시 적용할 일은 없다.
#   ★기록용이다 — 클러스터를 다시 만들 때 이대로 세우면 된다.
#
# ★다시 세우는 순서 (클러스터를 새로 만들었을 때)
#   1) 이 파일 적용                  kubectl apply -f 20-controller-내려받음.yaml
#   2) 웹훅 인증서 Job 두 개          원본 v1.14.5 매니페스트에서 admission-create/-patch 만
#   3) 설정 patch                    README 의 `kubectl patch configmap …`
#   4) 로드밸런서가 노드를 가리키게    (콘솔 — 노드 4대의 80·443)
#
# ★이미지는 다이제스트까지 고정돼 있다 (아래 DaemonSet 참고)
#   registry.k8s.io/ingress-nginx/controller:v1.14.5@sha256:af3312d0…
