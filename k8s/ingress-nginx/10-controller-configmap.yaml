# ingress-nginx 컨트롤러 설정 — ★손으로 적용한다 (ArgoCD 가 이 폴더를 안 본다)
#
# ⚠️★이 파일을 `kubectl apply` 하지 마십시오.
#    ingress-nginx 는 Helm 이 아니라 정적 매니페스트로 설치돼 있어, apply 하면
#    이 파일에 없는 키가 지워질 수 있습니다. ★README 의 `kubectl patch` 를 쓰십시오.
#
#      kubectl patch configmap ingress-nginx-controller -n ingress-nginx --type merge \
#        -p '{"data":{"use-forwarded-headers":"true","proxy-real-ip-cidr":"10.0.0.0/16"}}'
#
#    이 파일은 ★"무엇이 들어 있어야 하는가"의 정본입니다. 대조용입니다.
#    0808 실측 기준 이 ConfigMap 의 data 키는 ★아래 둘뿐입니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: "1.14.5"
data:
  # ── ★★로드밸런서 뒤에서 진짜 사용자 IP 를 보게 한다 (0808 추가)
  #
  # 없으면 앱이 보는 IP 가 사용자가 아니라 ★앞단의 주소가 됩니다. 그러면
  # IP 로 묶인 횟수 제한 9개가 전부 「전체 한 덩어리」로 돌아,
  # 한 사람이 한도를 채우면 ★그 시간 동안 전원이 막힙니다.
  #
  # ★2026-08-08 이전이 실제로 그 상태였습니다 — captcha_challenges_v2 2,996건에
  #   서로 다른 client_ip_hash 가 ★5개뿐이었습니다(2주치, 전부 인프라 주소).
  use-forwarded-headers: "true"

  # ⚠️★넓히지 마십시오. 여기 적힌 대역에서 온 X-Forwarded-For 만 믿습니다.
  #    0.0.0.0/0 으로 열면 ★아무나 자기 IP 를 속여 횟수 제한을 우회할 수 있습니다.
  #    지금 값 = 로드밸런서가 들어오는 대역만.
  #
  # ★이 한 줄이 캡차의 안전을 떠받칩니다 — catchap-captcha 의 client_ip() 는
  #   X-Forwarded-For 의 ★맨 앞을 읽습니다. 원래는 위조 가능한 자리인데,
  #   real_ip_recursive 가 신뢰 대역이 아닌 첫 주소를 골라 위조값을 버리고,
  #   nginx 가 XFF 를 $remote_addr 로 ★통째로 교체하기 때문에 안전합니다.
  #   0808 에 실제로 위조를 시도해 막히는 것을 확인했습니다.
  proxy-real-ip-cidr: "10.0.0.0/16"
