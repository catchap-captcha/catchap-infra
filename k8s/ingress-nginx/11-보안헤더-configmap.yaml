# 모든 응답에 붙일 보안 헤더 — ★손으로 적용한다 (ArgoCD 가 이 폴더를 안 본다)
#
#   kubectl apply -f k8s/ingress-nginx/11-보안헤더-configmap.yaml
#   kubectl patch configmap ingress-nginx-controller -n ingress-nginx --type merge \
#     -p '{"data":{"add-headers":"ingress-nginx/security-headers"}}'
#   kubectl rollout restart ds/ingress-nginx-controller -n ingress-nginx
#
# ★왜 주석(annotation)이 아니라 이 방법인가
#   ingress-nginx 1.9 부터 `allow-snippet-annotations` 기본값이 ★false 다.
#   그래서 Ingress 에 configuration-snippet 을 써도 무시된다(0819 실측: 이 클러스터도
#   그 키가 아예 없어 기본 false). 스니펫을 열면 Ingress 로 임의의 nginx 설정을
#   넣을 수 있게 되므로, ★열지 않고 add-headers 로 간다.
#
# ★왜 지금까지 없었나 — 헤더는 캡차 도메인에만 있었다(앱이 직접 붙임).
#   www·api 에는 아무것도 없었다(0818 실측).
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-headers
  namespace: ingress-nginx
data:
  # ★max-age 를 ★1년이 아니라 1일로 둔다.
  #   교과서 값은 31536000(1년)이지만, 브라우저가 한 번 보면 그 기간 동안
  #   이 도메인을 ★http 로는 아예 안 간다. 이 프로젝트는 반납 예정이고 도메인이
  #   나중에 어떻게 쓰일지 모르므로, 되돌릴 수 없는 1년 대신 1일로 둔다.
  #   지금도 http 로 오면 https 로 302 를 주고 있어 실효는 거의 같다.
  Strict-Transport-Security: "max-age=86400; includeSubDomains"

  # 브라우저가 Content-Type 을 제멋대로 추측하지 않게 한다.
  # 업로드된 파일이 스크립트로 해석되는 종류의 사고를 막는다.
  X-Content-Type-Options: "nosniff"

  # 남의 사이트가 우리 화면을 iframe 에 넣어 클릭을 가로채는 것을 막는다.
  # ⚠️캡차 페이지는 이미 CSP frame-ancestors 로 우리 도메인만 허용하고 있어
  #   이 헤더가 새로 막는 것은 없다(0818 실측). 운영 콘솔 쪽이 실익이다.
  X-Frame-Options: "SAMEORIGIN"

  # 밖으로 나갈 때 주소 전체를 넘기지 않는다(경로·쿼리에 든 것이 새지 않게).
  Referrer-Policy: "strict-origin-when-cross-origin"
