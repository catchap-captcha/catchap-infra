apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: catchap
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # ★★maxUnavailable 을 0 에서 1 로 바꿨다 (0804 실측).
      #   안티어피니티로 "같은 노드 금지"를 걸면, 노드 2대에 파드 2벌인 상태에서
      #   maxUnavailable:0 은 **영원히 Pending** 이 된다 —
      #   옛 파드가 두 노드를 다 차지해 새 파드가 앉을 자리가 없는데,
      #   옛 파드를 먼저 안 내리기 때문이다. 서로 기다린다.
      #   → 노드가 2대인 한 "무중단 배포"와 "노드 분리"는 동시에 안 된다.
      #     노드 분리를 골랐다. 배포는 우리가 고르는 순간이고 노드 장애는 안 고른다.
      #   ⚠️배포 중 몇십 초 동안 1벌로 받는다. 로드밸런서가 준비 안 된 파드로는
      #     안 보내므로 끊기지는 않는다.
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
      annotations:
        # ★nginx 설정을 고치면 이 값이 바뀌어 파드가 새로 뜬다.
        #   ConfigMap 만 고치면 nginx 가 안 읽는다 — 이걸 안 넣으면 "고쳤는데 왜 그대로지"가 된다.
        #   ⚠️설정을 고칠 때 이 날짜도 같이 고칠 것.
        catchap.io/nginx-conf-rev: "2026-08-04b"
    spec:
      # ★저장소가 비공개다. 이게 없으면 노드가 이미지를 못 받아 ImagePullBackOff 로 멈춘다.
      #   ⚠️문법 검사·스키마 검증으로는 안 걸린다. 실제로 띄워 봐야 나온다.
      imagePullSecrets:
        - name: catchap-registry
      # ★★root 로 안 돌린다.
      #   처음에 root 로 두고 capabilities 만 버렸더니 nginx 가 기동할 때
      #   chown("/var/cache/nginx/client_temp") 을 시도하다 [emerg] 로 죽었다.
      #   CHOWN 권한을 되돌려 주는 대신 **처음부터 nginx 사용자(101)로 시작**한다 —
      #   그러면 chown 할 이유 자체가 없어진다.
      securityContext:
        runAsUser: 101          # nginx
        runAsGroup: 101
        runAsNonRoot: true
        # ★emptyDir 은 기본이 root 소유라 101 이 못 쓴다. fsGroup 으로 그룹 쓰기를 연다.
        fsGroup: 101
      # ★★같은 노드에 두 벌이 붙는 것을 아예 금지한다 (0804 실측으로 추가).
      #   topologySpreadConstraints 만으로는 부족했다 — 그건 **놓을 때만** 보고
      #   놓은 뒤에는 안 고친다. 롤링 업데이트로 옛 파드가 빠지면서 실제로 둘 다
      #   같은 노드(2-b)에 쏠린 것을 확인했다.
      #   ⚠️노드가 1대만 남으면 두 번째 파드는 Pending 이 된다. 그게 낫다고 판단했다 —
      #     한 노드에 둘을 띄워 봐야 그 노드가 죽으면 같이 죽는다.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: frontend
      # ★영역 균형은 "되도록"(ScheduleAnyway)으로 남긴다.
      #   나중에 노드가 늘면 같은 영역에 몰리지 않게 유도하되, 못 지킨다고 파드를 막지는 않는다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      containers:
        - name: frontend
          # ★0805 18:3x — 팀이 오늘 다시 구운 프로덕션 이미지로 교체했습니다.
          #   태그는 이미지 ID (옛 서버 `catchap-frontend:c48cdec` 를 그대로 가져옴).
          #   ★박힌 API 주소가 `https://api.catchap5.com/api/v1` 인 것을 확인했습니다 —
          #     프론트는 빌드 때 주소가 코드에 박히므로 이걸 안 보면 엉뚱한 곳을 부릅니다.
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-front-repo/catchap-frontend:b160971
          imagePullPolicy: IfNotPresent
          # ★★배포 중 502 를 없앤다 (2026-08-12 실측으로 넣음).
          #
          #   0804 에 "로드밸런서가 준비 안 된 파드로는 안 보내므로 끊기지 않는다" 고
          #   적어 두었는데, ★재기동 중 90번 두드려 3번 실패했다(502 둘·연결끊김 하나).
          #
          #   ★왜 끊기나 — 파드가 Terminating 이 되는 것과 인그레스가 대상 목록에서
          #     빼는 것은 ★동시가 아니다. 목록에서 빠지기 전에 프로세스가 먼저 멈추면
          #     그 사이에 온 요청이 갈 곳을 잃는다 → 502.
          #
          #   ★sleep 5 는 "잠깐 더 받아 준다" 는 뜻이다. 그동안 인그레스가 목록을
          #     갱신하고, 그 뒤에 SIGTERM 이 온다. terminationGracePeriod 30초 안이라
          #     정상 종료할 시간도 남는다.
          #
          #   ⚠️maxUnavailable:0 으로는 못 고친다 — 안티어피니티와 노드 2대 때문에
          #     영원히 Pending 이 된다(0804 실측). 그래서 preStop 으로 푼다.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - name: http
              containerPort: 8080
          # ★정적 파일만 내보내므로 liveness 와 readiness 가 같아도 된다.
          #   백엔드처럼 "DB 까지 준비됐나" 를 물을 게 없다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # ★nginx 는 캐시와 PID 파일을 써야 한다. 루트를 읽기 전용으로 잠그려면
            #   이 둘을 따로 열어 줘야 한다.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # ★8080 을 쓰므로 NET_BIND_SERVICE 도 필요 없다. 전부 버린다.
              drop: ["ALL"]
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
