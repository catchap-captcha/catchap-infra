# 프론트엔드 — nginx 설정
#
# ★★프론트는 **빌드할 때 값이 코드 안에 박힌다.** nginx 는 이미 만들어진 파일을
#   그대로 내보낼 뿐이라, 여기서 환경변수를 바꿔도 화면은 안 바뀐다.
#   → **API 주소를 바꾸려면 다시 빌드해서 이미지를 새로 구워야 한다.**
#   쿠버네티스의 한계가 아니라 프론트 빌드 방식(Vite) 때문이다. 앞으로도 안 없어진다.
#
# ★그래서 이 ConfigMap 은 **nginx 설정용**이다. 앱 설정이 아니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: catchap
  labels:
    app.kubernetes.io/name: frontend
data:
  default.conf: |
    # ★8080 을 쓴다. 80 이 아니다.
    #   1024 미만 포트는 바인딩에 특권(NET_BIND_SERVICE)이 필요한데,
    #   그 권한을 안 주려고 포트를 올렸다. 인그레스가 서비스로 보내므로
    #   밖에서 보이는 포트는 안 바뀐다.
    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      # ★단일 페이지 앱이라 없는 경로는 전부 index.html 로 보낸다.
      #   이게 없으면 /courses/3 을 새로고침할 때 404 가 난다.
      location / {
        try_files $uri $uri/ /index.html;
      }

      # ★쿠버네티스가 살아 있는지 물어볼 자리.
      #   index.html 로 재는 것보다 가볍고, 앱이 깨져도 이건 뜬다.
      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      # 정적 자산은 오래 캐시한다. 파일 이름에 해시가 붙어 있어 안전하다.
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # ★index.html 은 절대 캐시하지 않는다. 새 배포가 안 보이는 사고를 막는다.
      location = /index.html {
        add_header Cache-Control "no-store";
      }

      gzip on;
      gzip_types text/plain text/css application/json application/javascript
                 text/xml application/xml image/svg+xml;
      gzip_min_length 1024;
    }
