# 클러스터 안에서 서로 못 부르게 — NetworkPolicy (들어오는 것만)
#
# ★무엇을 막나
#   지금은 클러스터 안의 ★아무 파드나 우리 앱 5개를 다 부를 수 있다.
#   프론트엔드 파드 하나가 뚫리면 거기서 곧장 STT 워커·행동AI·백엔드로 갈 수 있다.
#   이 규칙은 ★실제로 필요한 길만 남기고 나머지를 닫는다.
#
# ★실제로 필요한 길 (0810 에 설정·인그레스를 읽어서 확인한 것)
#   인그레스 → frontend:8080 · backend-api:8000 · captcha-api:8000
#   backend  → captcha-api:8000      (MAIN_CAPTCHA_URL)
#   backend  → stt-worker:8100       (STT_WORKER_URL)
#   captcha  → behavior-ai:8010      (BEHAVIOR_AI_URL)
#   그 외에는 없다. 프론트엔드 nginx 에 내부 proxy_pass 도 없고,
#   코드에 하드코딩된 클러스터 주소도 없다(둘 다 실제로 찾아봤다).
#
# ★나가는 것(Egress)은 이번에 안 건드린다.
#   DB·오브젝트 스토리지·금고·LLM·SNS 로그인 등 밖으로 나가는 곳이 많아,
#   하나라도 빠뜨리면 ★조용히 깨진다. 들어오는 것부터 하고 나가는 것은 나중에.
#
# ─────────────────────────────────────────────────────────────
# ⚠️★왜 네임스페이스가 아니라 IP 대역으로 인그레스를 허용하나
#
#   보통은 이렇게 쓴다.
#       from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
#
#   ★우리 인그레스는 그게 안 먹는다. `hostNetwork: true` 라서 파드 IP 가 ★노드 IP 다.
#   Calico 는 그 트래픽을 「어느 네임스페이스의 파드」가 아니라 「호스트에서 온 것」으로 본다.
#
#   ★시험으로 확인했다(0810, 버려도 되는 네임스페이스에서)
#       hostNetwork 파드 → 대상 파드     정책 없을 때 200 · ★전부 차단 걸면 막힘
#     즉 호스트에서 오는 것도 ★정책을 받는다. 안 열어 주면 사이트가 통째로 죽는다.
#
# ⚠️★노드 IP 를 하나하나 적지 않고 ★서브넷으로 적는 이유
#   노드 IP 는 바뀐다. ★0810 에 GPU 노드풀을 다시 만들면서 실제로 바뀌었다.
#   고정 IP 로 적어 두면 다음에 노드를 갈아 끼울 때 ★조용히 막힌다.
#   서브넷(10.0.2.0/24 · 10.0.6.0/24)은 클러스터 워커가 사는 곳이라 노드가 바뀌어도 유효하다.
#
#   ⚠️대신 그 서브넷 안의 다른 우리 장비(VM2·관리형 DB)도 앱에 닿을 수 있다.
#     ★이 규칙이 노리는 것은 「클러스터 ★안에서의 옆걸음」을 막는 것이다.
#     같은 VPC 안 우리 장비까지 막는 것은 이 규칙의 몫이 아니다(보안그룹의 몫).
#
# ⚠️★kubelet 의 살아있음 검사는 안 막힌다 — 이것도 시험으로 확인했다.
#   「전부 차단」을 건 채 60초를 봤는데 재시작 0 · 검사 실패 이벤트 0 이었다.
#   (막혔다면 앱 5개가 전부 죽는다. 그래서 제일 먼저 확인했다.)
#
# ─────────────────────────────────────────────────────────────
# ⚠️★이 파일은 ArgoCD 가 보지 않는다 (k8s/ 최상위라 앱 경로 밖).
#   `kubectl apply -f k8s/75-networkpolicy-공통.yaml` 로 ★사람이 적용한다.
#   60-pdb-공통.yaml 과 같은 방식이다.
#
# ★되돌리는 법 (막혔을 때 즉시)
#   kubectl -n catchap delete netpol --all
#   → 정책이 사라지면 곧바로 전부 열린다. 파드 재시작 필요 없다.
---
# ① 인그레스 → 프론트엔드
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.0.2.0/24}   # 워커 노드(core-2a) — 인그레스가 hostNetwork
        - ipBlock: {cidr: 10.0.6.0/24}   # 워커 노드(core-2b)
      ports:
        - {protocol: TCP, port: 8080}
---
# ② 인그레스 → 백엔드
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.0.2.0/24}
        - ipBlock: {cidr: 10.0.6.0/24}
      ports:
        - {protocol: TCP, port: 8000}
---
# ③ 인그레스 + ★백엔드 → 캡차
#    캡차는 두 곳에서 불린다: 사용자(인그레스)와 백엔드(MAIN_CAPTCHA_URL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: captcha-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: captcha
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.0.2.0/24}
        - ipBlock: {cidr: 10.0.6.0/24}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - {protocol: TCP, port: 8000}
---
# ④ ★캡차만 → 행동AI
#    행동AI 는 밖에서 부를 일이 없다. 캡차만 부른다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: behavior-ai-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: behavior-ai
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: captcha
      ports:
        - {protocol: TCP, port: 8010}
---
# ⑤ ★백엔드만 → STT 워커
#    GPU 를 쓰는 곳이라 특히 좁게 연다. 백엔드 말고는 부를 일이 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stt-worker-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stt-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - {protocol: TCP, port: 8100}
---
# ⑥ 나머지 전부 차단
#    위 다섯에 안 걸리는 파드(예: 마이그레이션 Job)는 들어오는 것을 아예 안 받는다.
#    ★새 앱을 넣으면 여기 걸려서 안 열린다 — 그때 위에 규칙을 하나 추가하면 된다.
#    「모르는 사이에 열려 있는 것」보다 「몰라서 안 열리는 것」이 낫다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: catchap
spec:
  podSelector: {}
  policyTypes: [Ingress]
