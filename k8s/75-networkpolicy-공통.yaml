# 클러스터 안에서 서로 못 부르게 — NetworkPolicy (들어오는 것만)
#
# ★무엇을 막나
#   전에는 클러스터 안의 ★아무 파드나 우리 앱 5개를 다 부를 수 있었다.
#   프론트엔드 파드 하나가 뚫리면 거기서 곧장 ★GPU 를 쓰는 STT 워커나 행동AI 로 갈 수 있었다.
#   지금은 ★그 두 곳이 자기를 부르는 앱 하나에게만 열려 있다.
#
# ★실제로 확인한 결과 (0810 밤)
#   있어야 하는 길     backend → stt-worker 200 · captcha → behavior-ai 200
#   ★막혀야 하는 길    frontend → stt-worker ★막힘 · frontend → behavior-ai ★막힘
#                     backend  → behavior-ai ★막힘 (백엔드는 행동AI 를 부를 일이 없다)
#   대조군            frontend → captcha 200 · frontend → backend 200
#                     ← ★측정기가 도는지부터 확인했다. 빈 결과를 「막힘」으로 읽지 않으려고.
#
# ─────────────────────────────────────────────────────────────
# ⚠️★★frontend · backend · captcha 에는 왜 안 걸었나 — 실제로 걸어 봤다가 되돌렸다
#
#   처음에는 다섯 앱 전부에 걸고 「나머지 전부 차단」까지 넣으려 했다.
#   한 개씩 적용하며 확인하도록 해 두었는데, ★세 번째(캡차)에서 사이트가 깨졌다.
#       www.catchap5.com/captcha-api/health → ★000 (연결 실패)
#   자동으로 전부 되돌아갔고 6개 검사 모두 200 으로 복구됐다.
#
#   ★원인 — Calico 가 IPIP 터널을 쓴다.
#     인그레스(ingress-nginx)는 `hostNetwork: true` 라 노드 IP 를 쓴다. 그래서
#     노드 서브넷(10.0.2.0/24 · 10.0.6.0/24)을 허용하면 될 줄 알았다. ★아니었다.
#
#     캡차 파드가 실제로 본 출발지를 재 보니 이랬다.
#         192.168.57.1 · 192.168.58.64      ← ★Calico 터널 주소
#         (host-10-0-2-128 의 터널 = 192.168.57.1)
#         (host-10-0-6-202 의 터널 = 192.168.58.64)
#     노드 IP 가 ★터널 주소로 바뀌어 도착한다.
#
#   ★그래서 못 한다 — 그 터널 주소는 ★파드 대역(192.168.0.0/16) 안이다.
#     허용하려면 사실상 ★모든 파드를 허용하는 것과 같아져서, 막는 의미가 없다.
#     노드별 터널 주소를 하나씩 적는 방법도 있지만, ★노드를 다시 만들면 바뀐다
#     (0810 에 GPU 노드풀을 다시 만들며 실제로 바뀌었다). 조용히 막히는 쪽이 더 나쁘다.
#
#   ★그리고 애초에 이 셋은 인그레스를 통해 ★인터넷에 열려 있는 앱이다.
#     클러스터 안 옆걸음을 막아 얻는 것이 STT·행동AI 만큼 크지 않다.
#     ★값어치가 큰 두 곳만 확실히 막고, 나머지는 근거를 적어 남긴다.
#
#   ⬜나중에 하려면 — Calico 를 IPIP `CrossSubnet` 이나 VXLAN 없이 쓰면 출발지 IP 가
#     보존될 수 있다. 다만 그것은 ★클러스터 전체 네트워크를 바꾸는 일이라 따로 다룬다.
#
# ─────────────────────────────────────────────────────────────
# ★먼저 확인한 것들 (버려도 되는 네임스페이스에서, 0810 밤)
#
#   ① Calico 가 정책을 진짜 강제하나
#      대조군 파드→파드 200 → 「전부 차단」 건 뒤 ★막힘.  강제된다.
#
#   ② ★kubelet 의 살아있음 검사가 막히나  ← 이게 제일 무서웠다
#      「전부 차단」을 건 채 60초를 봤다. ★재시작 0 · 검사 실패 이벤트 0.
#      막혔다면 앱 5개가 전부 죽는다. 그래서 제일 먼저 확인했다.
#
#   ③ hostNetwork 트래픽도 정책을 받나
#      hostNetwork 파드 → 대상 파드: 대조군 200 → 차단 후 ★막힘. ★받는다.
#      (그래서 인그레스를 안 열면 사이트가 죽는다 — 위 ⚠️로 이어진다)
#
# ─────────────────────────────────────────────────────────────
# ★나가는 것(Egress)은 안 건드린다.
#   DB·오브젝트 스토리지·금고·LLM·SNS 로그인 등 밖으로 나가는 곳이 많아
#   하나라도 빠뜨리면 ★조용히 깨진다. 들어오는 것부터 한다.
#
# ⚠️★이 파일은 ArgoCD 가 보지 않는다 (k8s/ 최상위라 앱 경로 밖).
#   `kubectl apply -f k8s/75-networkpolicy-공통.yaml` 로 ★사람이 적용한다.
#   60-pdb-공통.yaml 과 같은 방식이다.
#
# ★되돌리는 법 (막혔을 때 즉시)
#   kubectl -n catchap delete netpol --all
#   → 곧바로 전부 열린다. 파드 재시작 필요 없다.
---
# ① ★백엔드만 → STT 워커
#    GPU 를 쓰는 곳이라 특히 좁게 연다. 백엔드 말고는 부를 일이 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stt-worker-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stt-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - {protocol: TCP, port: 8100}
---
# ② ★캡차만 → 행동AI
#    행동AI 는 밖에서 부를 일이 없다. 캡차만 부른다(BEHAVIOR_AI_URL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: behavior-ai-ingress
  namespace: catchap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: behavior-ai
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: captcha
      ports:
        - {protocol: TCP, port: 8010}
