# behavior-ai — 비밀이 아닌 설정
#
# ★★값의 출처 (0805)
#   옛 프로덕션 서버 `210.109.52.124` 에서 **7일째 돌고 있는 컨테이너와 그 이미지**를
#   직접 열어서 읽었다. 추측한 값이 없다.
#
#     docker inspect catchap-behavior-ai --format '{{.Config.Cmd}} …'
#     docker run --rm --entrypoint cat <이미지> /app/app/config.py
#     curl http://127.0.0.1:8010/health          ← 실제로 무엇이 떠 있는지
#
#   ⚠️환경변수의 **값**은 안전장치에 막혀 못 읽었다. 그래서 **이름과 코드 기본값**으로
#     맞췄고, 값이 필요한 것은 아래 20-secret 으로 뺐다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: behavior-ai-config
  namespace: catchap
  labels:
    app.kubernetes.io/name: behavior-ai
data:
  TZ: "Asia/Seoul"

  # ══════════════════════════════════════════════════════════════════════
  # ── ★비밀 보관소(Secrets Manager) 연동 — 2026-08-10 신설
  # ══════════════════════════════════════════════════════════════════════
  # 앱이 기동할 때 금고에서 비밀값을 읽어 환경변수로 넣는다(`app/secrets_loader.py`).
  # ★열쇠 두 개(SECRETS_ACCESS_KEY·SECRETS_SECRET_KEY)만 behavior-ai-secret 에
  #   있고 나머지 비밀값은 전부 금고에 있다. 백엔드가 0807 에 간 길과 같다.
  #
  # 왜 — K8s Secret 은 이름과 달리 암호화가 아니라 ★base64 다. etcd 에 사실상
  #      평문으로 들어가고 `kubectl get secret` 만 되면 다 읽힌다.
  #      금고는 KMS(kms11)로 암호화되고 누가 언제 읽었는지 기록이 남는다.
  #
  # ⚠️★여기 이름을 더하기 ★전에 금고에 시크릿이 있어야 한다 —
  #   없는 이름을 적으면 로더가 예외를 던져 ★파드가 기동에 실패한다.
  SECRETS_BACKEND: "kakaocloud"
  # 시크릿 4건 → 환경변수 6개. 2026-08-10 에 ★실제로 읽어 K8s 값과 대조했다
  # (값은 안 찍고 sha256 앞 10자로 — 5개 전부 일치).
  #   catchap-behavior-ai-db-account    MYSQL_USER · MYSQL_PASSWORD
  #   catchap-behavior-ai-collect-key   COLLECT_API_KEY
  #   catchap-behavior-ai-admin-key     ADMIN_API_KEY
  #   catchap-service-bridge-key        CAPTCHA_BACKEND_API_KEY
  #     ★마지막 것은 ★캡차와 공유한다 — 캡차의 BEHAVIOR_AI_BACKEND_KEY 와
  #       행동AI 의 CAPTCHA_BACKEND_API_KEY 는 ★같은 값이다(sha256 로 확인).
  #       한쪽만 바꾸면 수집이 401 로 조용히 끊기므로 ★한 시크릿에 묶었다.
  SECRETS_NAMES: "catchap-behavior-ai-db-account,catchap-behavior-ai-collect-key,catchap-behavior-ai-admin-key,catchap-service-bridge-key"
  # ★엔드포인트는 코드 기본값과 같지만, 어디에 붙는지 보이는 게 낫다.
  SECRETS_IAM_ENDPOINT: "https://iam.kakaocloud.com/identity/v3"
  SECRETS_ENDPOINT: "https://secrets-manager-service.kr-central-2.kakaocloud.com"
  # ★★부분 실패를 막는 관문 (2026-08-10 · catchap-behavior-ai #6)
  #   ⚠️로더의 기존 검사는 ★전체 합계가 0일 때만 걸린다. 시크릿 4건 중 하나에서
  #     키 이름이 바뀌거나 빠지면 나머지가 성공해 ★조용히 통과한다.
  #     0810 에 실제로 재현했다 — DB_USER 가 DB_USERNAME 으로 들어간 시크릿을
  #     흉내 냈더니 예외 없이 지나갔다.
  #   ★여기 적은 변수가 하나라도 안 오면 로더가 예외를 던져 파드가 안 뜬다.
  #     옛 파드가 계속 받으므로 서비스는 안 끊긴다 — 그게 옳은 실패다.
  #   ⚠️금고에서 키를 뺄 때는 ★여기서도 같이 빼야 한다. 안 그러면 기동이 막힌다.
  SECRETS_REQUIRED_VARS: "MYSQL_USER,MYSQL_PASSWORD,COLLECT_API_KEY,ADMIN_API_KEY,CAPTCHA_BACKEND_API_KEY"

  # ── 데이터베이스 (관리형 MySQL)
  # ★캡차와 같은 인스턴스, 다른 데이터베이스다. 이름 규칙도 캡차와 맞춘다.
  # ★★0805 — IP(10.0.2.193) 에서 콘솔이 정본으로 주는 DNS 이름으로 바꿨다.
  #   ★역할을 정하는 것은 포트다 — 3306 은 언제나 **현재 Primary** 로 간다.
  #     호스트명(az-a/az-b)은 역할과 무관(0731 connection_id 확증 · 0803 장애조치 재확인).
  MYSQL_HOST: "az-b.mysql-team1.5f428f1b341249c983ab19c6f8f3fdb4.mysql.managed-service.kr-central-2.kakaocloud.com"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "catchap_ai"
  # ★MYSQL_USER 는 여기 두지 않는다 → 금고 `catchap-behavior-ai-db-account` 에 있다.
  #   비밀이라서가 아니라 ★비밀번호와 ★같이 회전하기 때문이다.
  MYSQL_POOL_SIZE: "5"

  # ── 모델
  # ★★코드 기본값은 `models/production` 인데 **이미지에 그 폴더가 없다.**
  #   기본값으로 두면 모델이 **말없이 안 뜬다**(앱은 그래도 200 을 준다).
  #   그래서 여기서 번들 경로를 못 박는다.
  #
  # ★★0811 — 번들을 바꿨다 (sw님 요청 · catchap-behavior-ai #9·#10)
  #
  #   이미지 안에 번들이 ★두 벌 있다(0811 파드 안에서 직접 확인).
  #     /app/models/candidate/revalidation_two_view_participant_safe_20260722/   ← 옛것
  #     /app/models/candidate/surface_aware_veto_20260810/                       ← ★지금 것
  #
  #   ★왜 바꾸나 — 옛 번들의 임계값은 07-22 데이터에서 뽑은 것이라 지금 캡차 화면의
  #     동작점이 아니다. 캡차를 ★정상 통과한 사람의 40.9% 가 의심으로 기록되고 있었다
  #     (sw님이 DB 로 확인 · 같은 궤적 200건 재채점 44.0% 로 채점 경로 일치도 확인).
  #     새 번들은 같은 궤적에서 8.5% 다.
  #
  #   ⚠️★이것은 「승격」이 아니다. 8.5% 도 기준(배포 1%·실험 3%)에는 미달이다.
  #     ★그림자 모드 안에서 더 나은 번들로 바꾸는 것뿐이다(sw님이 먼저 밝힌 사실).
  #     RISK_POLICY_MODE 가 shadow 라 ★사용자에게 영향이 없다.
  #
  #   ★되돌리는 법 — 이미지를 다시 굽지 않아도 된다. 이 한 줄을 옛 경로로 되돌리고
  #     `kubectl -n catchap rollout restart deploy/behavior-ai` 하면 끝이다.
  #     두 번들이 같은 이미지 안에 있어서 가능하다.
  #
  #   ⚠️ConfigMap 만 바꾸면 파드가 ★스스로 다시 읽지 않는다. rollout restart 가 필요하다.
  #
  # ══════════════════════════════════════════════════════════════════════
  # 🚨★0811 — 새 번들로 바꿨다가 ★되돌렸다. 앱이 그 번들을 못 읽는다.
  # ══════════════════════════════════════════════════════════════════════
  #
  #   바꾸고 재시작했더니 /health 가 이렇게 나왔다.
  #     model_loaded: ★false
  #     model_version: ★null
  #
  #   ★원인 — 번들 안에 `DensityVeto` 라는 ★클래스 객체가 절여져(pickle) 있는데
  #     앱에 그 클래스가 ★없다. joblib 이 풀 때 이렇게 죽는다.
  #
  #       AttributeError: Can't get attribute 'DensityVeto' on <module '__main__'>
  #
  #   대조군 — 옛 번들은 같은 자리에서 ★정상으로 읽힌다(dict).
  #
  #   ⚠️★★그런데 앱이 이 오류를 ★조용히 삼킨다. 기동 로그에 한 줄도 안 남고
  #     파드는 Running·/health 는 200 이다. ★모델 없이 도는 상태가 겉으로는 정상이다.
  #     (ModelService.load() 가 실패하면 _bundle=None 으로 두고 끝난다)
  #
  #   ★모델을 만든 쪽에서 `DensityVeto` 를 ★앱이 import 할 수 있는 모듈에 두고
  #     번들을 다시 저장해야 한다. 설정만으로는 못 고친다.
  #
  #   ★되돌리기는 이 한 줄이면 됐다 — 두 번들이 같은 이미지 안에 있어서
  #     이미지를 다시 굽지 않고 경로만 옛것으로 돌리고 rollout restart 했다.
  #
  # ══════════════════════════════════════════════════════════════════════
  # ✅0811 두 번째 시도 — 고쳐진 번들로 다시 바꾼다 (sw님 PR #11)
  # ══════════════════════════════════════════════════════════════════════
  #
  #   ★sw님이 고친 것
  #     · DensityVeto 를 app/services/density_veto.py 로 옮김
  #       → 번들이 app.services.density_veto.DensityVeto 로 기록돼 앱이 찾는다
  #     · app/main.py 가 except Exception: pass 로 삼키던 것을 고쳐,
  #       모델이 안 실리면 [MODEL] 줄을 stderr 로 남긴다
  #     · 배포 대상 번들에 __main__ 문자열이 있으면 CI 가 실패하게 함
  #
  #   ★★바꾸기 전에 ★실제로 열어 봤다 (sw님이 요청하셨다 · 0811)
  #
  #     새 번들에는 sklearn 객체(StandardScaler 등)가 들어 있다. sklearn pickle 은
  #     판본에 민감한데 requirements 가 범위 지정(>=1.5,<2.0)이고, 이미지가 실제로
  #     어느 판본을 깔았는지는 pip 층이 캐시돼 빌드 로그에 안 남아 있었다.
  #
  #       이미지의 sklearn   ★1.9.0        (sw님 학습 환경과 ★같다)
  #       옛 번들(대조군)     열림 · 검사통과 · 판본 경고 ★없음
  #       ★새 번들           열림 · 검사통과 · 판본 경고 ★없음
  #       운영 경로 load()   ★True · model_version=surface_aware_veto_20260810
  #
  #     ★`sys.modules` 손질 없이 깨끗한 프로세스에서 쟀다.
  #       (sw님 로컬 검증에는 그 손질이 들어가 있어 첫 시도의 문제를 못 잡았다고
  #        먼저 밝히셨다. 그래서 이번엔 ★운영 이미지 안에서 확인했다.)
  #
  #   ⚠️「승격」이 아니다. 8.5% 도 기준(배포 1%·실험 3%)에는 미달이고
  #     RISK_POLICY_MODE 가 shadow 라 사용자에게 영향이 없다.
  #
  #   ★되돌리기 — 이미지를 다시 굽지 않는다. 이 한 줄을 옛 경로로 되돌리고
  #     `kubectl -n catchap rollout restart deploy/behavior-ai` 하면 끝이다.
  # ══════════════════════════════════════════════════════════════════════
  # ✅0812 세 번째 번들 — 조준 구간을 보는 모델 (sw님 catchap-behavior-ai#20)
  # ══════════════════════════════════════════════════════════════════════
  #
  #   이미지 안에 이제 번들이 ★세 벌 있다.
  #     /app/models/candidate/revalidation_two_view_participant_safe_20260722/
  #     /app/models/candidate/surface_aware_veto_20260810/                     ← 직전 것
  #     /app/models/candidate/aim_overall3_20260812/                           ← ★지금 것
  #
  #   ★무엇이 달라지나 — 집기 **전** 포인터 이동(조준)까지 보고 판정한다.
  #     0812 실사용 1,167건에서, 분류기가 튕긴 시도의 드래그는 10.9점인데 그 앞
  #     조준은 19.2점으로 멀쩡했다(통과한 시도는 15.2 / 20.1점). 곧장 끌어다 놓는
  #     사람은 드래그가 짧을 뿐이고, 판단 근거는 조준 구간에 남아 있었다.
  #     번들의 `uses_aim` 플래그를 앱이 보고 조준을 분류기에 넘긴다.
  #
  #   ⚠️★catchap-captcha#28 이 먼저 배포돼 있어야 한다 — 그게 조준을 여기까지
  #     보내준다. 없으면 조준 없는 입력으로 채점되는데, 실측으로 오탐이
  #     0.0% → 0.4% 수준이라 무너지지는 않는다(다만 이 값은 낙관적이다).
  #
  #   ★0811 의 pickle 문제는 해당 없다 — 이 번들엔 커스텀 클래스가 없고 lightgbm
  #     객체뿐이다. 저장소 밖 깨끗한 프로세스에서 열리는 것까지 확인했다.
  #
  #   ★되돌리기 — 이 한 줄을 옛 경로로 되돌리고 rollout restart. 이미지를 다시
  #     굽지 않는다. 세 벌이 같은 이미지에 있다.
  PRODUCTION_MODEL_DIR: "models/candidate/aim_overall3_20260812"

  # ── 위험도 판정 방식
  # ★★shadow = "AI 가 이렇게 판단했을 것이다"를 기록만 하고 **실제 캡차 결과를 안 바꾼다.**
  #
  # ══════════════════════════════════════════════════════════════════════
  # 🚨0812 — active 로 바꾼다. ★승격 기준을 통과해서가 아니다.
  # ══════════════════════════════════════════════════════════════════════
  #
  #   ★넘긴 것 — 실사용 오탐이 18.9% 에서 전체 3.0% 로 내려왔다. 원인이 둘이었다.
  #     거부권 문턱이 드래그 단위로 잡혔는데 채점은 세션 단위였던 것(12.8%p),
  #     그리고 분류기가 조준 구간을 못 보던 것(6.2%p).
  #
  #   ⚠️★못 넘긴 것 — 알고 켠다.
  #       처음 보는 짧은 궤적 공격   41.3% 통과              (기준 10%)
  #       특정 참가자               7번에 1번 캡차 한 번 더   (기준 3%)
  #
  #     사람 표본이 10명뿐이라 모델로는 못 넘는 벽이다. 안 멈칫하는 스타일이 그중
  #     1명이라 모델이 그 움직임을 배울 표본이 없다. 숫자와 근거는
  #     catchap-behavior-ai 의 docs/AIM_CLASSIFIER_DECISION_20260812.md 에 있다.
  #
  #   ★그럼에도 켜는 이유 — 승급 캡차라 오탐의 대가가 "차단"이 아니라 "캡차 한 번
  #     더"이고, 이미 로그인 5회 실패한 사람에게만 뜬다.
  #
  #   ⚠️★캡차 쪽 BEHAVIOR_POLICY_MODE 도 같이 active 여야 실제로 막는다. 한쪽만
  #     active 면 아무 일도 안 일어난다 — AI 가 혼자 사용자를 막지 못하게 한 설계다.
  #
  #   ⚠️★catchap-captcha#29 가 먼저 배포돼 있어야 한다. 그 전에는 두 서버의 정책이
  #     어긋난 30초 동안 캡차 파드 2벌이 전부 빠져 로그인이 막힌다.
  #
  #   ★되돌리기 — 이 값과 캡차 쪽 값을 shadow 로 되돌리고 rollout restart.
  RISK_POLICY_MODE: "active"
