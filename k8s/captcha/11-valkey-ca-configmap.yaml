  name: valkey-ca
  namespace: catchap
  labels:
    app.kubernetes.io/name: captcha
# ★이 인증서는 비밀이 아닙니다.
#   MemStore(Valkey) 서버가 자기 신원을 증명하는 ★공개 인증서입니다.
#   새어도 잃을 것이 없어서 Secret 이 아니라 ConfigMap 으로 둡니다.
#
# 어디서 받았나
#   콘솔 → MemStore → Valkey → catchap-valkey-prod → 접근 제어
#        → 전송 암호화(TLS) → [CA 파일]
#
# ★확인한 것 (2026-08-12)
#   받은 파일의 SHA256 = 22399e676881447a682d3d49732c6a1ef43a5c5a28f75813119feb052186874c
#   0803 에 적어 둔 지문과 ★같습니다.
#   이 CA 로 검증을 ★켠 채 붙어 TLSv1.3 · AUTH +OK · PING +PONG 을 받았습니다.
#
# ⚠️붙일 때 요령 — server_hostname 은 ★엔드포인트가 아니라 인증서 CN 입니다.
#   서버 인증서에 subjectAltName 이 없어서, 엔드포인트 이름으로 붙으면
#   Hostname mismatch 로 거부됩니다. CN = service.kakaoenterprise.com
#
#   ★서버가 내미는 잎 인증서는 이 CA 와 ★지문이 다릅니다 (CA 가 같은 이름으로
#     발급하기 때문). 잎 지문을 CA 지문과 비교하면 안 됩니다 — 0812 에 한 번 틀렸습니다.
