apiVersion: v1
kind: Namespace
metadata:
  name: catchap
  annotations:
    # ⚠️★★prune 안전장치 — 이 파일이 실수로 지워져도 네임스페이스는 안 지운다.
    #   네임스페이스가 지워지면 그 안의 파드·Secret·ConfigMap 이 ★전부 같이 사라진다.
    #   되돌릴 수 없는 유일한 자원이라 여기만 못을 박아 둔다.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: catchap
