# ★캡차를 바깥에 여는 규칙.
#   옛 구조에서 Caddy 가 하던 일(도메인 → 앱 연결)을 여기가 대신한다.
#
# ⚠️적용 전에 확인할 것 두 가지
#   ① captcha.catchap5.com 의 DNS 레코드가 아직 없다 → 로드밸런서를 가리키게 만들어야 한다
#   ② 인그레스 컨트롤러가 아직 클러스터에 없다 → cluster-admin 을 받은 뒤 설치한다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: captcha
  namespace: catchap
  labels:
    app.kubernetes.io/name: captcha
  annotations:
    # ── ★IP 당 요청 제한 (0819 추가) — 단순 HTTP 폭주를 막는다
    #
    # ★캡차는 ★남의 사이트에 심는 위젯이 부른다. 한 회사 회선(NAT) 뒤에서
    #   여러 사람이 동시에 풀 수 있으므로 www·api 보다 ★두 배로 둔다.
    #   앱 자체에도 분당 챌린지 30개 제한이 따로 있다 — 이건 그 앞에 치는 그물이다.
    #
    # ⚠️진짜 사용자 IP 기준이다 — use-forwarded-headers 와 proxy-real-ip-cidr 가
    #   켜져 있어야 성립한다(k8s/ingress-nginx/10-controller-configmap.yaml).
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "200"
spec:
  ingressClassName: nginx
  rules:
    - host: captcha.catchap5.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: captcha-api
                port:
                  name: http
