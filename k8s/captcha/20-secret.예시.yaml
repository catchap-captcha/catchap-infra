# ★★이 파일은 예시다. 실제 값을 여기에 적지 않는다. git 에도 올리지 않는다.
#
# 실제 시크릿은 명령으로 만든다. 값을 파일에 남기지 않는 방법이다.
#
#   kubectl -n catchap create secret generic captcha-secret \
#     --from-literal=DB_PASSWORD='…' \
#     --from-literal=APP_SECRET='…' \
#     --from-literal=CAPTCHA_SITE_KEY='…' \
#     --from-literal=CAPTCHA_SITE_SECRET='…' \
#     --from-literal=CAPTCHA_ADMIN_KEY='…' \
#     --from-literal=BEHAVIOR_AI_BACKEND_KEY='…'
#
# ★값의 출처
#   DB_PASSWORD              catchap_captcha_app — 인프라-캡처-비공개/자격증명.txt
#   나머지 5개               옛 GPU 서버에서 돌던 프로세스의 환경변수
#                            ⚠️컷오버 때 회전을 권한다. 옛 서버에 평문으로 남아 있다.
#
# ★나중에 — Secrets Manager 에서 직접 읽어 오게 바꾼다(백엔드에 그 코드가 이미 있다).
#   지금은 클러스터 권한이 없어 그 연동을 못 얹으므로 kubectl 시크릿으로 시작한다.
apiVersion: v1
kind: Secret
metadata:
  name: captcha-secret
  namespace: catchap
type: Opaque
stringData:
  DB_PASSWORD: "여기에-넣지-말-것"
  APP_SECRET: "여기에-넣지-말-것"
  CAPTCHA_SITE_KEY: "여기에-넣지-말-것"
  CAPTCHA_SITE_SECRET: "여기에-넣지-말-것"
  CAPTCHA_ADMIN_KEY: "여기에-넣지-말-것"
  BEHAVIOR_AI_BACKEND_KEY: "여기에-넣지-말-것"
