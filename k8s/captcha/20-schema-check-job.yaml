# 캡차 — 배포 ★전에 스키마가 맞는지 확인하는 Job (2026-08-11 신설)
#
# ★★무엇을 막나
#
#   캡차 앱은 0810 부터 표를 ★스스로 만들지 않습니다(DDL 권한도 뗐습니다).
#   대신 기동할 때 표·칼럼이 다 있는지 ★확인하고, 없으면 죽습니다.
#   (app/db.py 의 `_verify_schema()` · SCHEMA_MANAGED_EXTERNALLY=true)
#
#   ★그 자체는 잘 만든 것입니다. 조용히 어긋난 채로 도는 것보다 낫습니다.
#   ⚠️그런데 ★배포가 이미 시작된 뒤에 죽습니다. 그러면 이렇게 됩니다.
#
#       maxUnavailable=1 · 복제본 2
#       → 옛 파드 1벌이 내려가고, 새 파드는 준비되지 않는다
#       → ★1벌로 줄어든 채 배포가 멈춘다 (중단은 아니지만 이중화가 깨진다)
#
#   ★이 Job 은 그 판정을 ★배포 앞으로 당깁니다.
#   PreSync 라 ArgoCD 가 ★파드를 건드리기 전에 돕니다. 실패하면 동기화가
#   멈추고 ★옛 파드 2벌이 그대로 서비스합니다.
#
#       전   배포 시작 → 새 파드가 안 뜸 → 1벌로 줄어든 채 멈춤
#       후   ★배포 자체가 안 시작됨 → 2벌 그대로 · 로그에 없는 표·칼럼 이름이 찍힘
#
# ─────────────────────────────────────────────────────────────
# ★왜 「적용」이 아니라 「검사」인가
#
#   백엔드는 마이그레이션을 ★적용합니다(alembic upgrade head). 캡차는 못 합니다.
#
#     ① 캡차 저장소에 alembic 이 ★없습니다. `deploy/schema.sql` 한 장뿐입니다.
#     ② 그 파일은 ★여러 번 못 돌립니다 — `CREATE TABLE IF NOT EXISTS` 15개는
#        괜찮지만 ★`ALTER TABLE ADD COLUMN` 6개가 두 번째부터 「칼럼 중복」으로
#        실패합니다. 그대로 자동 적용하면 ★배포가 막힙니다.
#     ③ 적용하려면 DDL 권한이 필요한데, 그건 0810 에 ★일부러 뗀 것입니다.
#        되돌리면 그 작업이 무의미해집니다.
#
#   ★그래서 이 Job 은 ★읽기만 합니다. 앱과 ★같은 계정(captcha-secret)을 쓰고
#   ★같은 코드(`_verify_schema`)로 판정합니다. 새 권한도, 새 비밀값도 없습니다.
#
#   ⬜적용까지 자동으로 하려면 캡차 저장소에 alembic 이 들어가야 합니다(민서님).
#     그때는 이 Job 을 백엔드처럼 `alembic upgrade head` 로 바꾸면 됩니다.
#
# ─────────────────────────────────────────────────────────────
# ⚠️★이미지 태그는 ★Deployment 와 같아야 합니다
#
#   검사 Job 이 옛 태그면 ★옛 코드가 기대하는 스키마를 검사합니다. 그러면
#   새 코드가 필요로 하는 칼럼이 없어도 통과해 버립니다.
#
#   ★catchap-captcha 의 배포 워크플로가 `MANIFEST_DIR: k8s/captcha` 로
#     ★이 폴더의 모든 image 줄을 함께 바꿉니다(2026-08-11 변경).
#
#   ⚠️★2026-08-11 정정 — 처음에 「태그가 갈리면 워크플로가 스스로 실패한다」고
#     적었는데 ★사실이 아니었습니다. 그 검사는 고친 ★뒤를 보고 있었고,
#     갱신이 전부 같은 sha 로 덮어쓰므로 ★어떤 경우에도 안 물었습니다.
#     지금은 고치기 ★전이 갈려 있었으면 ★경고를 남깁니다(막지는 않습니다 —
#     그 갱신이 이미 하나로 모았기 때문입니다).
#
# ★손으로 돌려 보려면
#   kubectl -n catchap create job --from=cronjob/... 는 안 됩니다(CronJob 이 아님).
#   대신 이 파일에서 hook 주석 3줄을 빼고 이름만 바꿔 apply 하면 됩니다.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: captcha-schema-check
  namespace: catchap
  labels:
    app.kubernetes.io/name: captcha-schema-check
  annotations:
    # ★PreSync = 파드를 건드리기 ★전에 돈다. 실패하면 동기화가 멈춘다.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    # ★다음 실행 직전에 지운다 = ★직전 실행의 로그가 남아 있다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ★다시 시도하지 않는다. 스키마가 모자란 것은 기다린다고 낫지 않는다.
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: captcha-schema-check
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: catchap-registry
      containers:
        - name: schema-check
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-captcha-repo/catchap-captcha:e7d02cc
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import sys
              sys.path.insert(0, "/app")
              # ★백엔드와 API 가 다릅니다 — 캡차는 get_settings() 가 없고
              #   모듈 수준 `settings` 객체를 씁니다(0811 파드 안에서 확인).
              from app.config import settings as s
              from app.db import Database

              print("── 검사 대상 DB: %s" % s.db_name, flush=True)
              print("── SCHEMA_MANAGED_EXTERNALLY = %s" % s.schema_managed_externally, flush=True)
              if not s.schema_managed_externally:
                  print("★SCHEMA_MANAGED_EXTERNALLY 가 false 입니다 — 앱이 스스로 표를 만들려 합니다.")
                  print("  DDL 권한은 0810 에 뗐으므로 그 상태로는 기동이 실패합니다.")
                  sys.exit(1)
              db = Database(s)
              db._verify_schema()
              print("★스키마가 코드와 맞습니다 — 배포를 진행합니다.", flush=True)
          envFrom:
            # ★앱과 ★똑같은 설정·비밀값을 씁니다. 새로 만든 것이 없습니다.
            - configMapRef:
                name: captcha-config
            - secretRef:
                name: captcha-secret
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
