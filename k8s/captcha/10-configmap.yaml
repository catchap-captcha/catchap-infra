# 캡차 서비스 — 비밀이 아닌 설정
#
# ★값의 출처: 옛 GPU 서버에서 실제로 돌고 있는 프로세스의 환경변수를 읽어 왔다.
#   추측한 값이 하나도 없다. 다만 아래 두 개는 쿠버네티스에 맞게 **일부러 바꿨다.**
#     BEHAVIOR_AI_URL   127.0.0.1:8010  →  서비스 이름
#     ALLOWED_ORIGINS   *               →  실제 출처만
apiVersion: v1
kind: ConfigMap
metadata:
  name: captcha-config
  namespace: catchap
  labels:
    app.kubernetes.io/name: captcha
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"

  # ══════════════════════════════════════════════════════════════════════
  # ── ★비밀 보관소(Secrets Manager) 연동 — 2026-08-10 신설
  # ══════════════════════════════════════════════════════════════════════
  # 앱이 기동할 때 금고에서 비밀값을 읽어 환경변수로 넣는다(`app/secrets_loader.py`).
  # ★열쇠 두 개(SECRETS_ACCESS_KEY·SECRETS_SECRET_KEY)만 captcha-secret 에 있고
  #   나머지 비밀값은 전부 금고에 있다. 백엔드가 0807 에 간 길과 같다.
  #
  # 왜 — K8s Secret 은 이름과 달리 암호화가 아니라 ★base64 다. etcd 에 사실상
  #      평문으로 들어가고 `kubectl get secret` 만 되면 다 읽힌다.
  #      금고는 KMS(kms11)로 암호화되고 누가 언제 읽었는지 기록이 남는다.
  #
  # ⚠️★여기 이름을 더하기 ★전에 금고에 시크릿이 있어야 한다 —
  #   없는 이름을 적으면 로더가 예외를 던져 ★파드가 전부 기동에 실패한다.
  # ⚠️값을 바꿀 때는 금고에서 ★새 버전을 만들고 파드를 재시작하면 끝이다.
  #   로더가 default_version 을 따라가므로 여기도 코드도 안 고친다.
  SECRETS_BACKEND: "kakaocloud"
  # 시크릿 6건 → 환경변수 11개. 2026-08-10 에 ★실제로 읽어 K8s 값과 대조했다
  # (값은 안 찍고 sha256 앞 10자로 — 9개 전부 일치).
  #   catchap-captcha-app-secret        APP_SECRET
  #   catchap-captcha-db-account        DB_USER · DB_PASSWORD
  #   catchap-captcha-admin-key         CAPTCHA_ADMIN_KEY
  #   catchap-captcha-asset-s3-keys     ASSET_S3_ACCESS_KEY · ASSET_S3_SECRET_KEY
  #   catchap-service-bridge-key        BEHAVIOR_AI_BACKEND_KEY (+행동AI 쪽 이름도 같이 옴)
  #   catchap-main-captcha-site-secret  CAPTCHA_SITE_KEY · CAPTCHA_SITE_SECRET
  #     ★마지막 것은 ★백엔드와 ★공유한다 — 백엔드의 MAIN_CAPTCHA_SITE_SECRET 과
  #       캡차의 CAPTCHA_SITE_SECRET 은 ★같은 값이다(sha256 로 확인).
  #       한쪽만 바꾸면 강의 캡차 연동이 조용히 깨지므로 ★한 시크릿에 묶었다.
  #   catchap-valkey-auth               VALKEY_PASSWORD
  #     ★2026-08-12 추가. 민서님이 임시 상태(정답 좌표·만료·레이트리밋·토큰
  #       유효성)를 캐시로 옮기는 설계를 하시는 중이라 ★먼저 값만 준비해 둔다.
  #       아직 코드가 안 쓰므로 SECRETS_REQUIRED_VARS 에는 ★넣지 않는다 —
  #       넣으면 코드가 쓰기 전부터 기동 조건이 되어 버린다.
SECRETS_NAMES: "catchap-captcha-app-secret,catchap-captcha-db-account,catchap-captcha-admin-key,catchap-captcha-asset-s3-keys,catchap-service-bridge-key,catchap-main-captcha-site-secret,catchap-valkey-auth"
  # ★엔드포인트는 코드 기본값과 같지만, 어디에 붙는지 보이는 게 낫다.
  SECRETS_IAM_ENDPOINT: "https://iam.kakaocloud.com/identity/v3"
  SECRETS_ENDPOINT: "https://secrets-manager-service.kr-central-2.kakaocloud.com"
  # ★★부분 실패를 막는 관문 (2026-08-10 · catchap-captcha #10)
  #   ⚠️로더의 기존 검사는 ★전체 합계가 0일 때만 걸린다. 시크릿 6건 중 하나에서
  #     키 이름이 바뀌거나 빠지면 나머지가 성공해 ★조용히 통과한다.
  #     0810 에 실제로 재현했다 — DB_USER 가 DB_USERNAME 으로 들어간 시크릿을
  #     흉내 냈더니 예외 없이 지나갔다.
  #   ★여기 적은 변수가 하나라도 안 오면 로더가 예외를 던져 파드가 안 뜬다.
  #     옛 파드가 계속 받으므로 서비스는 안 끊긴다 — 그게 옳은 실패다.
  #   ⚠️금고에서 키를 뺄 때는 ★여기서도 같이 빼야 한다. 안 그러면 기동이 막힌다.
  SECRETS_REQUIRED_VARS: "APP_SECRET,DB_USER,DB_PASSWORD,CAPTCHA_ADMIN_KEY,ASSET_S3_ACCESS_KEY,ASSET_S3_SECRET_KEY,BEHAVIOR_AI_BACKEND_KEY,CAPTCHA_SITE_KEY,CAPTCHA_SITE_SECRET"

  # ── 데이터베이스 (관리형 MySQL)
  # ★DB_UNIX_SOCKET 은 넣지 않는다. db.py 는 호스트가 localhost 일 때만 소켓을 쓰므로
  #   여기서는 무해하지만, 없는 파일을 가리키는 설정을 남겨 두면 다음 사람이 헷갈린다.
  # ★★0805 — IP(10.0.2.193) 에서 콘솔이 정본으로 주는 DNS 이름으로 바꿨다.
  #   그 IP 는 az-a 노드의 것이고, 인스턴스가 교체되면 바뀐다. 이름은 안 바뀐다.
  #   ★역할을 정하는 것은 포트다 — 3306 은 언제나 **현재 Primary** 로 간다.
  #     호스트명(az-a/az-b)은 역할과 무관하다(0731 connection_id 로 확증 · 0803 장애조치로 재확인).
  #   ★파드 안에서 이 이름이 풀리고 3306·3307 이 열리는 것을 0805 에 실측했다.
  DB_HOST: "az-b.mysql-team1.5f428f1b341249c983ab19c6f8f3fdb4.mysql.managed-service.kr-central-2.kakaocloud.com"
  DB_PORT: "3306"
  DB_NAME: "catchap_captcha"
  # ★DB_USER 는 여기 두지 않는다 → 금고 `catchap-captcha-db-account` 에 있다.
  #   비밀이라서가 아니라 ★비밀번호와 ★같이 회전하기 때문이다. 두 곳에 나눠 두면
  #   계정을 바꿀 때 한쪽만 고쳐 놓고 "비밀번호가 틀렸습니다"를 보게 된다.

  # ── 행동 판별(behavior-ai) 연동
  # ★★옛 서버에서는 127.0.0.1:8010 이었다. 같은 서버에 둘 다 있었기 때문이다.
  #   쿠버네티스에서는 서로 다른 파드라 서비스 이름으로 불러야 한다.
  #   ⚠️behavior-ai 를 아직 배포하지 않았다. 그 전에는 이 주소가 안 뜬다.
  BEHAVIOR_AI_URL: "http://behavior-ai.catchap.svc.cluster.local:8010"
  BEHAVIOR_EVENT_TRANSPORT: "shadow"

  # ── 캡차 정책 (옛 서버 값 그대로)
  CHALLENGE_TTL_SECONDS: "60"
  MAX_ATTEMPTS: "3"

  # ── ★★0808 추가 — 로드밸런서 뒤에서 진짜 사용자 IP 를 보게 한다
  #
  # 【무엇이 잘못돼 있었나】
  #   main.py:211 의 client_ip() 는 trust_proxy 가 꺼져 있으면 request.client.host,
  #   즉 ★바로 앞단(ingress 파드)의 주소를 봅니다. 그래서 ★모든 사용자가 한 사람이 됩니다.
  #
  #   ★실측(0808) — captcha_challenges_v2 2,996건에 서로 다른 client_ip_hash 가 ★5개뿐.
  #     그 5개는 사용자가 아니라 인프라 주소(도커 브리지·노드)입니다. 2주치입니다.
  #
  # 【그래서 무엇이 깨져 있었나 — 두 가지입니다】
  #   ① main.py:683  ip_challenges_1m >= max_challenges_per_minute → 429
  #      ★분당 30건 제한이 사용자별이 아니라 ★전체 합계로 돕니다.
  #      동시 사용자가 조금만 늘어도 ★전원이 "Too many CAPTCHA requests" 를 받습니다.
  #   ② 봇 판별의 "같은 IP 에서 몰아치기" 신호가 ★항상 참이라 무의미해집니다.
  #
  # 【왜 켜도 안전한가 — 짐작이 아니라 확인했습니다】
  #   client_ip() 는 X-Forwarded-For 의 ★맨 앞을 읽습니다. 보통은 사용자가 위조할 수 있는
  #   자리라 위험하지만, 우리 경로에서는 앱에 도착하기 전에 두 번 걸러집니다.
  #     · ingress nginx.conf  real_ip_recursive on · set_real_ip_from 10.0.0.0/16
  #         → 오른쪽부터 훑어 ★신뢰 대역이 아닌 첫 주소를 고름 (위조한 맨 앞은 버려짐)
  #     · ingress nginx.conf  proxy_set_header X-Forwarded-For ★$remote_addr
  #         → 덧붙이지 않고 ★통째로 교체. 앱에 가는 XFF 는 ★값 하나뿐입니다.
  #   ★위조 시험(0808) — 노트북에서 X-Forwarded-For: 203.0.113.99 을 붙여 두 LB 로 보냈고,
  #     기록된 것은 203.0.113.99 이 아니라 ★진짜 공인 IP 였습니다.
  #
  # ⚠️전제 — 이 값은 ★ingress 뒤에 있을 때만 참입니다. 캡차를 인그레스 없이 노출하면
  #    (NodePort 직결 등) 그 순간 사용자가 IP 를 위조할 수 있습니다.
  # ★백엔드는 같은 문제를 uvicorn --proxy-headers 로 풀었습니다(catchap-backend Dockerfile).
  #    캡차는 앱에 이미 스위치가 있어 그것을 씁니다 — 새 방식을 만들지 않습니다.
  TRUST_PROXY: "true"

  # ══════════════════════════════════════════════════════════════════════
  # ── ★앱이 스키마를 만들지 않는다 (2026-08-10 · catchap-captcha #11)
  # ══════════════════════════════════════════════════════════════════════
  # 이 앱은 기동할 때마다 CREATE TABLE IF NOT EXISTS 를 14번, 멱등 ALTER 를 6번 했다.
  # 그래서 앱 계정 `catchap_captcha_app` 에 ★CREATE·ALTER·INDEX·REFERENCES 권한이
  # 있어야 했고, 그것은 ★캡차 파드가 뚫리면 표를 지울 수 있다는 뜻이다.
  #
  # true = 기동할 때 DDL 을 ★한 줄도 안 하고, ★있어야 할 표 14개·칼럼 6개가
  #        다 있는지 ★확인만 한다. 없으면 ★기동을 막는다.
  #
  # ★실측 — 라이브 DB 에 그 14개와 6개가 ★전부 있다(2026-08-10).
  #   = 이 DDL 은 그동안 ★아무 일도 안 하고 있었다. 켜도 동작이 안 바뀐다.
  #
  # ⚠️앞으로 캡차 스키마를 바꿀 때는 ★사람이 `catchap_dba` 로 적용한다
  #   mysql --defaults-file=<dba.cnf> catchap_captcha < deploy/schema.sql
  #   ★app/db.py 의 SCHEMA 를 고치면 deploy/schema.sql 도 같이 고쳐야 한다 —
  #     안 맞으면 기동 확인에서 걸려 ★파드가 안 뜬다.
  SCHEMA_MANAGED_EXTERNALLY: "true"

  # ── 이미지 안에 구워 둔 자산 경로
  # ★문항 자산(이미지·조각)을 어디서 읽는가 — catchap-captcha 의 app/asset_storage.py
  #
  #   예전에는 367MB(8,238개)를 ★이미지에 구워 넣었다. 그 자산은 .gitignore 로 막혀 있어
  #   git 에 없기 때문에 GitHub Actions 가 이미지를 굽지 못했다(COPY 가 "그런 파일 없음").
  #   이제 오브젝트 스토리지에서 읽는다. 이미지가 367MB 작아지고, 자산이 바뀌어도
  #   ★재빌드가 필요 없다.
  #
  #   ★백엔드의 MEDIA_* 와 같은 모양이다. 다른 방식을 새로 만들지 않는다.
  #   ⚠️값이 틀리면 파드가 ★기동에서 바로 죽는다(조용히 로컬로 안 떨어진다).
  #      0807 에 백엔드가 "s3" 오타로 미디어 기능이 전부 죽었는데 기동은 정상이라
  #      로그에 한 줄도 안 남았던 일이 있었다. 그래서 일부러 시끄럽게 만들었다.
  ASSET_STORAGE_BACKEND: "object"
  ASSET_BUCKET: "catchap-storage-prod-team1"
  # ★버킷 안 최상위 접두사. 백엔드 미디어(media/)와 겹치지 않게 따로 둔다.
  ASSET_KEY_PREFIX: "captcha-service/final"
  ASSET_S3_ENDPOINT: "https://objectstorage.kr-central-2.kakaocloud.com"
  ASSET_S3_REGION: "kr-central-2"
  # ★ASSET_S3_ACCESS_KEY · ASSET_S3_SECRET_KEY 는 여기 두지 않는다 →
  #   ★금고(Secrets Manager)에서 온다. 시크릿 이름 = catchap-captcha-asset-s3-keys.
  #   2026-08-10 에 K8s Secret(captcha-secret) 에서 금고로 옮겼고,
  #   2026-08-11 에 옛 전용 계정 catchap-captcha-object-storage 를 ★삭제했다.
  #   ★지금 이 키의 주인은 서비스 계정 catchap-captcha 다.

  # ⬜ASSET_STORAGE_BACKEND=local 로 되돌리면 예전처럼 이 폴더를 읽는다.
  #    다만 이미지에 자산이 없으므로 로컬에서만 의미가 있다.
  FINAL_DIR: "data/final"
  IMAGE_DIR: "data/processed"
  LABELING_DIR: "data/labeling"
  RUNTIME_DIR: "data/runtime"

  # ── CORS
  # ★★옛 서버는 "*" 였다. 아무 사이트나 이 캡차를 부를 수 있다는 뜻이다.
  #   이전을 기회로 좁힌다. 붙일 도메인이 늘면 여기에 추가한다.
  # ★캡차 자기 주소가 들어 있는 이유 (2026-08-12 추가 · 성원님 요청)
  #   캡차가 iframe 안에서 돌 때, 요청의 Origin 은 감싼 페이지가 아니라
  #   ★캡차 자기 주소로 갑니다. 그 값이 명단에 없으면 ★자기 요청을 자기가 거절합니다.
  #
  # ★실측 (0812 · 캡차 파드 안에서 Origin 만 바꿔 가며)
  #   https://www.catchap5.com       → 201  통과
  #   https://captcha.catchap5.com   → ★403 Origin not allowed   ← 자기 자신
  #   https://evil.example.com       → 403  (막혀야 하는 것 — 그대로 막힙니다)
  #   Origin 없음                     → 403
  #
  # ⚠️보안이 약해지지 않습니다 — 우리 캡차가 ★자기 자신을 부르는 것만 허용합니다.
  #   check_origin() 은 startswith 로 검사하므로 명단에 없는 출처는 그대로 403 입니다.
  ALLOWED_ORIGINS: "https://www.catchap5.com,https://catchap5.com,https://captcha.catchap5.com"

  # ── ★★0805 추가 — 빠뜨렸던 값. 없으면 위젯이 iframe 으로 안 뜹니다
  # `_apply_security_headers`(main.py:586~593)가 이 목록으로 CSP 를 만듭니다.
  #
  #   비어 있으면   frame-ancestors 'self'          ← ★www.catchap5.com 에서 끼워 넣기 차단
  #   채우면        frame-ancestors 'self' <목록>
  #
  # ★그리고 /api/config 가 이 목록을 프론트로 내려보내, 프론트가 postMessage 의
  #   targetOrigin 을 그 범위로만 좁힙니다(main.py:642~645). 비면 좁힐 대상이 없습니다.
  # ⚠️`*` 는 넣지 않습니다 — 아무 사이트나 우리 캡차를 끼워 넣을 수 있게 됩니다.
  EMBED_ORIGINS: "https://www.catchap5.com,https://catchap5.com"

  # ── 캐시 (MemStore Valkey)  ★2026-08-12 추가
  #
  # ★왜 넣나 — 캡차의 임시 상태를 DB 대신 캐시에 두려는 설계 때문입니다.
  #   지금 만료 챌린지를 지우면 `captcha_challenges_v2` 를 참조하는 표 다섯 개가
  #   전부 ON DELETE CASCADE 라 ★행동AI 학습 데이터 23,647건이 같이 사라집니다.
  #   임시 상태를 캐시의 EX(만료)로 옮기면 청소 코드도 CASCADE 위험도 없어집니다.
  #
  # ⚠️아직 ★쓰는 코드가 없습니다. 값만 미리 둡니다 — 설계는 민서님이 진행 중.
  #
