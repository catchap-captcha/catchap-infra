apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catchap-captcha
  namespace: argocd
  finalizers:
    # ★앱을 지울 때 만들어 둔 것도 같이 지웁니다. 실수로 지우면 서비스가 내려가니
    #   지우기 전에 반드시 무엇이 딸려 있는지 확인하세요.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:catchap-captcha/catchap-infra.git
    targetRevision: main
    path: k8s/captcha
    # ★.예시 로 끝나는 파일은 절대 적용하지 않습니다.
    #   ArgoCD 는 경로 안의 모든 yaml 을 적용하므로, 예시 시크릿이 섞여 있으면
    #   ★살아 있는 비밀값을 "여기에-넣지-말-것" 으로 갈아치웁니다 (0807 에 직전에 발견).
    #   ⚠️자리가 중요합니다 — ★source 아래입니다.
    #     destination 아래에 두면 쿠버네티스가 unknown field 로 ★거부합니다.
    directory:
      exclude: '{*.예시.yaml,*.yaml.예시}'
  destination:
    server: https://kubernetes.default.svc
    namespace: catchap
  syncPolicy:
    # ★2026-08-07 자동 동기화를 켭니다.
    #
    #   켜기 전에 확인한 것 — 조건을 채우고 켰습니다.
    #     · 네 저장소 모두 한 바퀴가 끝까지 도는 것을 봤습니다
    #       (코드 → 이미지 → 창고 → 매니페스트 태그 → ArgoCD)
    #     · 화면에서 Sync 를 여섯 번 눌러 무엇이 어떻게 바뀌는지 봤습니다
    #     · 파드가 못 뜨면 옛 파드가 계속 받는다는 것도 실제로 겪었습니다
    #       (캡차 이름 충돌로 새 파드가 죽었는데 서비스는 안 끊겼습니다)
    #
    #   ★무엇이 달라지나 — 병합하면 사람이 Sync 를 안 눌러도 서버가 따라옵니다.
    #   ★되돌리기 — catchap-infra 에서 커밋 하나 revert 하면 옛 태그로 돌아옵니다.
    automated:
      # ✅★2026-08-08 prune 을 켭니다.
      #
      #   ★전에 적어 둔 「켜면 손으로 만든 Secret 4개가 날아간다」는 ★틀렸습니다.
      #   버려도 되는 네임스페이스에서 실제로 시험해 확인했습니다.
      #
      #     조건   git 경로에 매니페스트 0개 + prune 켬  (가장 사나운 조건)
      #     결과   표시 없는 Secret        → ★살아남음
      #            표시 있는 Secret(대조군) → ★지워짐   ← prune 이 실제로 돌았다는 증거
      #
      #   ★prune 은 ArgoCD 가 「자기 것」으로 아는 자원만 지웁니다.
      #     우리 Secret 4개(backend·captcha·behavior-ai·registry)는 손으로 만들어서
      #     tracking-id 주석도 instance 라벨도 없습니다. 앱의 자원 목록에 아예 없습니다.
      #
      #   ★켜기 전 확인 — 추적 자원 16개 전부 Synced · requiresPruning ★0건.
      #     즉 켜는 순간 지워지는 것이 하나도 없습니다.
      #
      #   ★덤으로 알게 된 것 — 모든 자원이 지워질 상황이면 ArgoCD 가 자동 동기화를
      #     스스로 거부합니다 ("auto-sync will wipe out all resources").
      #
      #   ⚠️★네임스페이스만은 따로 못을 박았습니다 — k8s/captcha/00-namespace.yaml 에
      #     Prune=false. 그것이 지워지면 안의 것이 전부 같이 사라지기 때문입니다.
      prune: true
      # ⚠️selfHeal = 사람이 kubectl 로 고친 것을 git 대로 되돌리는 기능.
      #   급할 때 손으로 막는 길을 남겨 두려고 아직 끕니다. 안정되면 켭니다.
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
  # ✅★2026-08-19 `/spec/replicas` 를 ★다시 무시합니다 — ★오늘 HPA 를 넣었기 때문입니다.
  #
  #   ⚠️0810 에 이 규칙을 ★일부러 뺐습니다. 그때 적은 이유는 이랬습니다 —
  #     「replicas 는 HPA 가 건드릴 수 있어서」라고 해 뒀는데 ★우리 클러스터에
  #     HPA 가 없었습니다. 그래서 얻는 것 없이 「git 에 적어도 안 되는 값」만
  #     하나 만드는 셈이었고, 실제로 stt-worker 에서 git 1 → 2 가 영영 반영되지
  #     않는 일을 당했습니다. ★그 판단은 그때 맞았습니다.
  #
  #   ★전제가 바뀌었습니다 — 0819 에 HPA 4개를 넣었습니다(k8s/61-hpa-공통.yaml).
  #     이제 replicas 를 정하는 것은 git 이 아니라 ★HPA 입니다.
  #
  #   ★안 넣으면 무엇이 깨지나 (0819 실측)
  #     부하를 주니 HPA 가 2 → 4 로 늘렸고, ArgoCD 는 그 상태를 ★OutOfSync 로
  #     봤습니다(어긋난 자원 = Deployment 하나, 어긋난 값 = replicas 하나).
  #     selfHeal 이 꺼져 있어 ★가만히 있었지만, ★다음 배포로 sync 가 도는 순간
  #     git 의 replicas: 2 가 그대로 적용되어 ★4벌이 2벌로 떨어집니다.
  #     ★하필 사람이 몰려서 늘어난 상태일 때 배포하면 그때 떨어집니다.
  #
  #   ★대조군 (0819) — 손으로 `kubectl scale --replicas=3` 한 것은
  #     ★17초 만에 2로 되돌아갔습니다. 즉 sync 가 돌면 replicas 는 확실히 덮입니다.
  #
  #   ⚠️손으로 바꾼 것도 이제 OutOfSync 로 안 드러납니다 — 그 대신 HPA 가
  #     minReplicas 로 곧 되돌리므로 손으로 바꾸는 길 자체가 의미를 잃었습니다.
  #     급할 때 벌 수를 바꾸려면 ★HPA 의 minReplicas 를 고치세요.
  #
  #   ⚠️`RespectIgnoreDifferences=true` 가 위 syncOptions 에 있어야 ★sync 할 때도
  #     이 규칙을 지킵니다. 없으면 diff 에서만 빠지고 sync 는 그대로 덮습니다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: captcha-api
      jsonPointers:
        - /spec/replicas
