apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catchap-stt-worker
  namespace: argocd
  finalizers:
    # ★앱을 지울 때 만들어 둔 것도 같이 지웁니다.
    # ⚠️여기에는 ★PVC(stt-model-cache)가 딸려 있습니다. 앱을 지우면 모델 캐시 2.9GB 도
    #   같이 사라지고, 다시 만들 때 HuggingFace 에서 다시 받습니다(서비스가 죽지는 않습니다).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:catchap-captcha/catchap-infra.git
    targetRevision: main
    path: k8s/stt-worker
    directory:
      exclude: '{*.예시.yaml,*.yaml.예시}'
  destination:
    server: https://kubernetes.default.svc
    namespace: catchap
  syncPolicy:
    automated:
      prune: true
      # ⚠️selfHeal 은 다른 앱과 같이 끕니다 — 급할 때 손으로 막는 길을 남깁니다.
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
  # ⚠️★ignoreDifferences 를 ★안 씁니다 (0810 오후 — 실제로 당해서 뺐습니다).
  #
  #   다른 앱을 따라 `/spec/replicas` 를 무시하게 해 뒀더니, git 에서 복제본을
  #   1 → 2 로 바꿔도 ★영영 반영되지 않았습니다. 전략(Recreate→RollingUpdate)만
  #   바뀌고 복제본은 1 그대로였습니다.
  #
  #   ★그 규칙은 「HPA 가 복제본을 건드리니 git 과 달라도 넘어가라」는 뜻인데,
  #     우리는 HPA 가 ★없습니다(0810 확인). 그러면 얻는 것 없이
  #     「git 에 적어도 안 되는 값」만 하나 만드는 셈입니다.
  #
  #   ★복제본은 git 이 정합니다. 손으로 kubectl scale 하면 ArgoCD 가 되돌립니다
  #     (selfHeal 은 꺼져 있어 다음 동기화 때 되돌아옵니다).
