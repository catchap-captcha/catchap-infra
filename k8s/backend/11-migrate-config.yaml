# 마이그레이션 Job 전용 설정 — ★앱과 ★다른 DB 계정을 쓰기 위해 따로 둡니다
#
# ★왜 따로 두나 — 앱 계정(`catchap_backend`)은 ★표 구조를 못 바꿉니다.
#   실측: CREATE TABLE 시도 → (1142) CREATE command denied
#   그건 ★일부러 그렇게 만든 것입니다. 앱이 뚫려도 표를 못 지우게 하려고요.
#   그래서 마이그레이션은 DDL 권한이 있는 `catchap_dba` 로만 돕니다.
#
# ★금고에서 읽습니다 — 값은 여기에도, K8s Secret 에도 없습니다.
#   `catchap-migrate-database-url` 안의 `DATABASE_URL` 이 catchap_dba 접속 문자열입니다.
#   ★열쇠는 backend-secret 의 부트스트랩 키를 그대로 씁니다 — 새 계정을 안 만듭니다.
#     (그 열쇠는 어차피 금고 19건을 다 여니, 하나 더 만들어도 사정거리가 안 줄어듭니다)
#
# ⚠️SECRETS_REQUIRED_VARS 를 꼭 둡니다 — 값이 안 들어오면 alembic 이 ★앱 계정으로
#   붙으러 갔다가 "CREATE command denied" 로 죽습니다. 그러면 원인이 「권한」처럼
#   보이지만 진짜 원인은 「금고에서 값을 못 읽음」입니다. 미리 시끄럽게 막습니다.
#
# ⚠️★이 ConfigMap 도 ★PreSync 훅입니다 — 순서 때문입니다.
#
#   ArgoCD 는 PreSync 훅을 ★일반 자원보다 먼저 돌립니다. 이 ConfigMap 을 평범한
#   자원으로 두면, ★첫 동기화 때 아직 안 만들어진 상태에서 Job 이 뜹니다.
#   그러면 Job 이 "configmap not found" 로 죽고, 원인이 「마이그레이션 실패」처럼
#   보이지만 진짜 원인은 ★순서입니다.
#
#   sync-wave 로 ★ConfigMap(-1) → Job(0) 순서를 못 박았습니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-migrate-config
  namespace: catchap
  labels:
    app.kubernetes.io/name: backend-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # ★Job 보다 먼저 (숫자가 작을수록 먼저)
    argocd.argoproj.io/sync-wave: "-1"
    # ★동기화가 끝나도 남깁니다 — 다음 훅을 만들기 직전에만 지웁니다
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  SECRETS_BACKEND: "kakaocloud"
  SECRETS_NAMES: "catchap-migrate-database-url"
  SECRETS_IAM_ENDPOINT: "https://iam.kakaocloud.com/identity/v3"
  SECRETS_ENDPOINT: "https://secrets-manager-service.kr-central-2.kakaocloud.com"
  SECRETS_REQUIRED_VARS: "DATABASE_URL"
