# 백엔드 — 비밀이 아닌 설정
#
# ★값의 출처
#   설정 이름 60개는 **실제로 구워진 이미지 안의 `app/core/config.py` 에서 읽었다.**
#   (로컬 작업트리는 다른 브랜치라 설정이 다르다 — 그걸 보고 쓰면 틀린다)
#
#     docker run --rm --entrypoint grep <이미지> -oE '^    [A-Z][A-Z0-9_]*:' /app/app/core/config.py
#
# ★여기 없는 설정은 이미지의 기본값이 쓰인다. 기본값으로 두면 안 되는 것만 적었다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: catchap
  labels:
    app.kubernetes.io/name: backend
data:
  # ★★ENV=prod 는 스위치가 아니라 관문이다.
  #   config.py 가 부팅할 때 아래를 검사하고 하나라도 걸리면 **부팅을 거부**한다.
  #     · JWT_SECRET_KEY 가 비었거나 개발용 기본값이면      거부
  #     · JWT_SECRET_KEY 가 32자 미만이면                  거부
  #     · CORS_ORIGINS 에 * 가 있으면                      거부
  #     · SMTP_USER / SMTP_APP_PASSWORD 가 비었으면         거부
  #   → 시크릿이 하나라도 빠지면 파드가 CrashLoopBackOff 로 돈다. 로그에 이유가 한국어로 찍힌다.
  ENV: "prod"

  # ── 주소 (CORS 와 메일 링크에 쓰인다)
  # ★루트 도메인이 아니라 www 를 정본으로 쓴다. 루트는 인그레스가 301 로 넘긴다.
  FRONTEND_URL: "https://www.catchap5.com"
  BACKEND_URL: "https://api.catchap5.com"
  CORS_ORIGINS: "https://www.catchap5.com,https://catchap5.com"

  # ── 데이터베이스 (관리형 MySQL)
  # ★3306 은 **지금 Primary** 를 가리킨다. 장애 조치가 나도 주소가 안 바뀐다.
  #   그래서 앱은 3306 하나만 본다. (3307 은 Standby 읽기 전용)
  # ⚠️비밀번호는 여기 없다 — DATABASE_URL 전체를 Secret 으로 넣는다(아래 20-secret 참고).
  #   URL 한 줄에 비밀번호가 섞여 있어 쪼갤 수가 없기 때문이다.

  # ── 미디어 (Object Storage)
  MEDIA_STORAGE_BACKEND: "s3"
  MEDIA_BUCKET: "catchap-storage-prod-team1"
  MEDIA_S3_ENDPOINT: "https://objectstorage.kr-central-2.kakaocloud.com"
  MEDIA_S3_REGION: "kr-central-2"
  MEDIA_KEY_PREFIX: ""

  # ── 자막 생성기 (GPU 서버) — 클러스터 밖의 VM 이라 IP 로 부른다
  # ★이 주소는 catchap-gpu-2a(10.0.5.0/24) 안이다. 워커에서 도달되는 걸 실측했다.
  STT_WORKER_URL: "http://10.0.5.57:8100"

  # ── 메인 캡차 — 같은 클러스터 안의 서비스라 이름으로 부른다
  # ★★옛 서버에서는 같은 박스라 127.0.0.1 이었다. 쿠버네티스에서는 서비스 이름이어야 한다.
  MAIN_CAPTCHA_URL: "http://captcha-api.catchap.svc.cluster.local:8000"
  DRAG_CAPTCHA_ENABLED: "true"

  # ── ★운영 모니터링 (0805 신설) — 노드·파드 지표를 프로메테우스에서 읽는다
  # ★왜 필요한가: 옛 구조는 백엔드가 자기를 psutil 로 쟀는데, 파드가 2벌이 되면서
  #   ★둘이 같은 행을 덮어썼고(요청마다 값이 튐), 컨테이너 안 psutil 은 cgroup 을 안 봐서
  #   ★파드가 아니라 노드를 재고 있었다(mem_total 15,993MB = 노드 용량. 정확히 같았다).
  # 비밀이 아니다 — 클러스터 내부 ClusterIP 라 밖에서 닿지 않는다.
  # ⚠️이 값이 비면 노드·파드 수집을 건너뛴다(로컬 개발은 종전대로 동작 — 하위호환).
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"
  # 몇 초마다 걷을지. ⚠️짧게 잡으면 server_metric_samples 가 빨리 쌓인다
  # (48시간 보존 × 대상 수). 30초면 대상당 5,760행/일 — 옛 에이전트 주기와 같다.
  CLUSTER_METRICS_INTERVAL_SEC: "30"

  # ══════════════════════════════════════════════════════════════════════
  # ⚠️★★0805 18:3x — 아래 SECRETS_* 는 ★지금 이미지에서 무시됩니다
  #   팀이 오늘 구운 프로덕션 이미지(79d5e2d05a1e)에 `secrets_loader.py` 가 없습니다.
  #   팀 브랜치에 그 파일이 애초에 없었습니다(소스에서도 확인).
  #   → 비밀값 10개를 backend-secret 에 다시 넣었습니다.
  #   ⬜jy님께 로더 병합을 요청하고, 병합되면 이 설정이 다시 살아납니다.
  #      그때 backend-secret 은 열쇠 2줄로 줄어듭니다.
  #   ★지우지 않고 남겨 둡니다 — 병합되면 그대로 동작하고, 이 주석이 이유를 설명합니다.
  # ══════════════════════════════════════════════════════════════════════
  # ── ★비밀 보관소(Secrets Manager) 연동 — 0805 신설
  # 앱이 기동할 때 금고에서 비밀값을 읽어 환경변수로 넣는다(`app/core/secrets_loader.py`).
  # ★열쇠 두 개(SECRETS_ACCESS_KEY·SECRETS_SECRET_KEY)만 Secret 에 있고, 나머지는 여기다.
  #   무엇을 읽을지는 **배포가 명시**한다 — 프로젝트 시크릿을 전부 긁으면 남이 만든 것까지
  #   읽으려 들고, 나중에 시크릿이 하나 늘었을 때 앱 동작이 말없이 바뀐다.
  SECRETS_BACKEND: "kakaocloud"
  # ★★여기 적힌 이름만 읽습니다. 없는 이름을 적으면 기동이 실패합니다
  #   (로더가 "SECRETS_NAMES에 있는 시크릿을 찾을 수 없습니다" 로 예외를 냅니다).
  #   → 시크릿을 만든 뒤에 이름을 추가합니다. 순서를 바꾸면 부팅이 막힙니다.
  # 0805 추가 2건 — 둘 다 ★금고에서 꺼낸 값으로 실제 접속까지 확인했습니다
  #   catchap-database-url    DATABASE_URL          → DB 붙음 (read_only=0 · 테이블 99개)
  #   catchap-media-s3-keys   MEDIA_S3_ACCESS_KEY   → 버킷 목록 조회 성공
  #                           MEDIA_S3_SECRET_KEY
  # ★시크릿 7건 → 환경변수 9개 주입. ENV=prod 부팅 관문도 통과했습니다.
  # 0805 추가 3건째: catchap-main-captcha-site-secret
  #   MAIN_CAPTCHA_SITE_SECRET — ★캡차 앱의 CAPTCHA_SITE_SECRET 과 같은 값이어야 합니다.
  #   두 값의 sha256 앞 16자를 대조해 같은 것을 확인했습니다(0805).
  #   ⚠️이 값과 MAIN_CAPTCHA_URL 둘 다 있어야 강의 캡차 연동이 켜집니다
  #     (services/lecture_service.py:76~77 이 둘을 보고 켜는 게이트).
  SECRETS_NAMES: "catchap-auth-jwt-secret,catchap-smtp-app-password,catchap-metrics-ingest-token,catchap-stt-worker-token,catchap-portone-keys,catchap-database-url,catchap-media-s3-keys,catchap-main-captcha-site-secret"
  # ★엔드포인트는 코드 기본값과 같지만, 어디에 붙는지 보이는 게 낫다.
  SECRETS_IAM_ENDPOINT: "https://iam.kakaocloud.com/identity/v3"
  SECRETS_ENDPOINT: "https://secrets-manager-service.kr-central-2.kakaocloud.com"

  # ── 메일
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  # ★SMTP_USER 는 비밀이 아니라 **로그인 계정(메일 주소)** 이다. 비밀번호는 금고에서 온다.
  #   ⚠️이 값이 비면 ENV=prod 에서 **부팅이 거부된다**(0805 실측). 메일이 "보낸 척"
  #     되는 걸 막으려는 설계라, 빈 채로 띄우는 우회는 하지 않는다.
  SMTP_USER: "09.daviya.09@daviya.kr"
  # ★화면에 보이는 발신자. 로그인 계정과 달라도 된다(별칭 send-as).
  MAIL_FROM: "catchap5@catchap5.com"
  MAIL_FROM_NAME: "CatChap"

  # ── 결제
  # ★가짜 결제는 프로덕션에서 코드가 스스로 막지만, 설정으로도 꺼 둔다.
  PAYMENT_MOCK_ENABLED: "false"
  PAYMENT_SUCCESS_URL: "https://www.catchap5.com/payment/success"
  PAYMENT_FAIL_URL: "https://www.catchap5.com/payment/fail"
  PAYMENT_CANCEL_URL: "https://www.catchap5.com/payment/cancel"

  # ── 업로드 상한 (이미지 기본값과 같지만, 값이 보이는 게 낫다)
  MAX_UPLOAD_BYTES: "2147483648"          # 2GB — 강의 영상
  MAX_MATERIAL_UPLOAD_BYTES: "52428800"   # 50MB — 강의 자료
  MAX_QUESTION_IMAGE_BYTES: "5242880"     # 5MB — 문제 이미지
