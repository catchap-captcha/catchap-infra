# DB 마이그레이션을 ★배포보다 먼저 돌리는 Job
#
# ★★왜 필요한가 — 2026-08-10 까지 우리 배포는 ★코드만 자동이었습니다.
#   alembic 을 부르는 곳이 매니페스트에도, initContainer 에도, Job 에도, CI 에도
#   ★한 군데도 없었습니다(0810 다시 확인). 그래서 표를 바꾸는 PR 이 병합되면
#   ★코드만 새것이 뜨고 DB 는 그대로였습니다. 화면에는 500 이나 이상한 오류로만
#   보여서 원인을 찾기 어려웠습니다. 0807 에 실제로 겪었습니다.
#
# ★어떻게 도나 — ArgoCD 의 PreSync 훅입니다.
#
#     main 병합 → 이미지 완성 → 매니페스트 태그 갱신
#        → ★① ArgoCD 가 ★이 Job 을 먼저 돌린다  (alembic upgrade head)
#        → ★② 성공해야 ★그다음에 새 파드를 띄운다
#
#   ⚠️★실패하면 배포가 ★멈춥니다. 새 파드가 안 뜨고 ★옛 파드가 계속 서비스합니다.
#     이게 핵심입니다 — 「DB 는 안 바뀌었는데 코드만 새것」이라는 상태가
#     ★구조적으로 안 생깁니다.
#
# ★계정 — 앱 계정이 아니라 `catchap_dba` 입니다. 앱 계정은 DDL 이 막혀 있습니다
#   (실측: CREATE TABLE → 1142 CREATE command denied). 값은 금고에서 읽습니다.
#   자세한 것은 11-migrate-config.yaml 주석.
#
# ⚠️★이미지 태그가 ★Deployment 와 같아야 합니다. 배포 워크플로가 이 파일의
#   image 줄도 같이 고칩니다(catchap-backend 저장소 deploy.yml).
#   ★태그가 어긋나면 「옛 코드의 마이그레이션」을 돌리게 됩니다.
#
# ⚠️★되돌리기는 자동이 아닙니다. alembic downgrade 는 사람이 판단해서 돌립니다.
#   마이그레이션이 잘못 나갔으면 코드를 revert 해도 ★DB 는 안 돌아옵니다.
---
apiVersion: batch/v1
kind: Job
metadata:
  # ★이름에 시각·해시를 안 붙입니다. PreSync 훅은 ArgoCD 가 동기화마다
  #   새로 만들고, 성공하면 지웁니다(아래 hook-delete-policy).
  name: backend-migrate
  namespace: catchap
  labels:
    app.kubernetes.io/name: backend-migrate
  annotations:
    # ★동기화 ★전에 돌린다. 성공해야 다음으로 넘어간다.
    argocd.argoproj.io/hook: PreSync
    # ★설정(11-migrate-config, wave -1)이 만들어진 ★뒤에 돈다
    argocd.argoproj.io/sync-wave: "0"
    # ★★다음 배포 직전까지 ★남깁니다 — 로그를 봐야 하기 때문입니다.
    #
    #   처음에는 HookSucceeded(성공하면 삭제)로 뒀는데, 실제로 돌려 보니
    #   ★성공하자마자 파드가 지워져 「무엇이 올라갔는지」를 못 봤습니다(0810 실측).
    #   마이그레이션은 나중에 "그때 뭐가 바뀌었지?"를 묻게 되는 일이라,
    #   ★마지막 한 번의 기록은 남아 있어야 합니다.
    #
    #   BeforeHookCreation = 다음 훅을 만들기 ★직전에만 지웁니다.
    #   → 항상 ★마지막 배포의 Job 과 로그가 남아 있습니다. 쌓이지도 않습니다.
    #     kubectl -n catchap logs job/backend-migrate
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ★한 번만 시도합니다. DDL 은 되돌리기 어려워서, 실패했을 때 자동으로 또
  #   돌리는 것보다 ★사람이 보는 편이 낫습니다.
  backoffLimit: 0
  # ★30분 안에 안 끝나면 실패로 봅니다. 표가 커지면 늘려야 할 수 있습니다.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: catchap-registry
      containers:
        - name: migrate
          # ⬜태그는 CI 가 커밋 해시로 고칩니다 — Deployment 와 ★같은 태그여야 합니다
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-backend-repo/catchap-backend:639e99b
          imagePullPolicy: IfNotPresent
          # ★먼저 「무엇을 할 것인지」를 찍고 돌립니다. 로그만 보고도 판단할 수 있게.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /app
              echo "── 지금 DB 판"
              alembic current
              echo "── 코드가 기대하는 판"
              alembic heads
              echo "── 올립니다"
              alembic upgrade head
              echo "── 올린 뒤"
              alembic current
          envFrom:
            # ★마이그레이션 전용 설정 (DDL 계정을 읽는다)
            - configMapRef:
                name: backend-migrate-config
            # ★금고를 여는 부트스트랩 열쇠 — 앱과 같은 것을 씁니다
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
