apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-worker
  namespace: catchap
  labels:
    app.kubernetes.io/name: stt-worker
spec:
  # ★★2벌이다 (2026-08-10 오후 — GPU 노드가 2대가 되면서 바꿨다).
  #
  #   전에는 GPU 가 ★한 장이라 1벌 + Recreate 였고, 배포하는 동안 자막 생성이
  #   잠깐 끊겼다. GPU 노드풀을 ★2개 가용영역에 하나씩(2-a·2-b) 다시 만들면서
  #   ★무중단 배포와 ★AZ 이중화를 둘 다 갖게 됐다.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stt-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # ★★maxSurge 는 ★0 이어야 한다. 여기가 함정이다.
      #
      #   GPU 는 총 ★2장이고 2벌이 이미 다 물고 있다. maxSurge 를 1 로 두면
      #   새 파드를 ★먼저 띄우려 하는데 ★세 번째 GPU 가 없어서 Pending 이 된다.
      #
      #   0 이면 「한 벌 내림 → GPU 한 장 빔 → 새 벌 올림 → Ready 확인」 순서라
      #   ★항상 한 벌이 살아서 받는다. 이것이 무중단이다.
      maxSurge: 0
      # ★1 이어야 한다. 0 이면 내릴 수가 없어 위와 같은 이유로 멈춘다.
      maxUnavailable: 1
  # ★AZ 이중화는 ★저절로 된다 — 노드마다 GPU 가 한 장뿐이라 두 벌이 같은 노드에
  #   못 앉고, GPU 노드는 2-a·2-b 에 한 대씩이다. 안티어피니티를 따로 안 걸어도 된다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt-worker
    spec:
      # ★저장소가 비공개다. 이게 없으면 ImagePullBackOff 로 멈춘다.
      imagePullSecrets:
        - name: catchap-registry
      # ★★nodeSelector 를 안 쓴다 — nvidia.com/gpu 를 달라고 하는 것으로 충분하다.
      #   그 자원을 가진 노드는 GPU 노드 하나뿐이라 스케줄러가 알아서 보낸다.
      #   노드 이름이나 노드풀 이름을 적으면 그것이 바뀔 때 같이 고쳐야 한다.
      #
      # ★안티어피니티도 없다 — 한 벌뿐이라 나눌 것이 없다.
      containers:
        - name: stt-worker
          # ⬜태그는 CI 가 커밋 해시로 고친다 (catchap-stt-worker 저장소의 deploy.yml)
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-ai-repo/catchap-stt-worker:4457790
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: stt-worker-config
            - secretRef:
                name: stt-worker-secret
          # ★★GPU 를 달라고 하는 줄이 ★이것 하나다.
          #   limits 에만 적는다 — 확장 자원은 requests 를 안 적으면 같은 값이 들어간다.
          #   ⚠️GPU 는 ★쪼갤 수 없다. 0.5 같은 값은 못 쓴다.
          #
          # ★cpu·memory 는 옛 GPU VM 에서 ★실측한 값이다 (0810, docker stats)
          #     MEM  481.1MiB (모델이 GPU 에 올라간 상태)   CPU 0.21% (대기 중)
          #     uvicorn RSS 509MB · GPU 메모리는 ★3892MiB / 15360MiB
          #   호스트 메모리를 적게 쓰는 이유는 모델이 ★GPU 에 올라가 있어서다.
          #   전사할 때 오디오 디코딩으로 잠깐 더 쓰므로 한도는 넉넉히 4Gi 로 둔다.
          #   ⚠️cpu 한도는 ★일부러 안 건다 — 한도를 걸면 전사 중에 조여져 느려진다.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              nvidia.com/gpu: 1
            limits:
              memory: "4Gi"
              nvidia.com/gpu: 1
          # ★/health 는 모델을 올리지 않는다(main.py 확인). 그래서 가볍고 빠르다.
          #   ⚠️모델은 ★첫 전사 요청 때 올라온다(lazy). 그래서 startupProbe 가 짧아도 된다 —
          #     기동 자체는 금방이고, 오래 걸리는 것은 첫 전사다.
          # ★★살아있음 검사가 ★전사 중인 파드를 죽였다 (2026-08-10 실제 장애).
          #
          #   전사는 GPU 로 ★길게 돈다. 강의 하나가 몇 분씩 걸린다.
          #   30초×3 = ★90초면 죽이도록 두었더니, 강의를 올렸을 때 전사 중에
          #   exitCode 137 로 죽고 강사님께 실패 메일이 나갔다.
          #
          #   ★진짜 원인은 코드였다 — async def 안에서 블로킹 호출을 해서
          #     이벤트 루프가 멈추고 /health 가 응답을 못 했다. 그건 고쳤다(def 로).
          #
          #   ★그래도 한도를 넉넉히 둔다. 「오래 걸리는 일」과 「먹통」을 시간만으로
          #     가르는 것이라, GPU 작업에는 여유가 필요하다.
          #     ★백엔드가 기다려 주는 시간(_WORKER_TIMEOUT_SEC = 1800초)과 맞췄다.
          #     그보다 오래 살아 있어도 어차피 백엔드가 먼저 포기한다.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60      # ★30초 × 60 = 1800초
          # ★준비됨 검사도 같은 이유로 늘린다 — 여기서 빠지면 ★다른 한 벌로 몰린다.
          #   두 벌이 다 전사 중이면 둘 다 빠져 ★서비스가 통째로 없어진다.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30      # ★10초 × 30 = 300초
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24   # 최대 2분
          securityContext:
            allowPrivilegeEscalation: false
            # ★루트 파일시스템을 잠근다. 쓰는 곳은 아래 두 군데뿐이다.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # ⚠️★root 로 돈다 — 이미지에 USER 지시가 없고, 모델 캐시 기본 경로가
            #   /root/.cache/huggingface 다. 비root 로 바꾸려면 이미지도 같이 고쳐야 해서
            #   이번 이전에서는 옛 VM 과 ★같은 조건을 유지했다.
            #   ⬜다음에 이미지를 손볼 때 비root + HF_HOME 으로 옮긴다.
          volumeMounts:
            # ★모델 캐시 볼륨이 ★없다 — 모델을 이미지에 구웠다 (0810 오후).
            #   PVC 는 가용영역에 묶여서, GPU 노드풀을 다른 AZ 에 다시 만들면
            #   파드가 영영 Pending 이 됐다. 앱 5개 중 이 워커만 디스크를 갖고
            #   있었는데, 없애서 앱 층이 다시 ★완전 무상태가 됐다.
            # ★업로드된 오디오를 잠깐 받아 두는 곳 (main.py 가 tempfile 을 쓴다)
            #   ⚠️백엔드가 영상이 아니라 ★오디오만 뽑아 보낸다(0806 수정, 11.66GB→89.1MB).
            #     그래도 여유를 두고 4Gi 로 잡는다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
