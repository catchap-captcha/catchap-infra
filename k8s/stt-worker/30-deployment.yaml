apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-worker
  namespace: catchap
  labels:
    app.kubernetes.io/name: stt-worker
spec:
  # ★★1벌이다 (2026-08-19 — ★영역 장애에서 회복되게 하려고 2벌에서 줄였다).
  #
  #   2026-08-10 에 2벌로 올렸었다. GPU 노드가 2대(2-a·2-b)가 되면서
  #   무중단 배포와 AZ 이중화를 둘 다 갖는다고 봤기 때문이다.
  #
  #   ★그런데 그 2벌이 GPU 2장을 ★다 물어 여유가 0이 됐다. 그래서
  #   한 영역이 통째로 죽으면 사라진 한 벌이 ★갈 자리가 없어 Pending 으로 멈춘다
  #   (0815 영역 장애 훈련에서 실측). 살아남은 한 벌로 서비스는 계속되지만
  #   ★그 하나가 죽으면 자막 생성이 멈추는 상태로 남는다.
  #
  #   1벌로 줄이면 GPU 한 장이 비고, 영역이 죽어도 남은 영역의 GPU 로
  #   ★스스로 옮겨 간다. 아래 maxSurge 도 같이 1 로 올릴 수 있게 된다.
  #
  #   ⚠️잃는 것 — 파드 하나가 죽었을 때 즉시 받아 줄 짝이 없다(재시작 동안 멈춤).
  #     STT 는 사람이 화면에서 기다리는 것이 아니라 뒤에서 도는 작업이고,
  #     0818 실측으로 ★24시간 동안 실제 작업이 0건이었다. 그래서 1벌로 둔다.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stt-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # ★★1 이다 (2026-08-19 — replicas 를 1 로 줄이면서 0 에서 올렸다).
      #
      #   2벌이던 때는 ★0 이어야 했다. GPU 2장을 2벌이 다 물고 있어서
      #   새 파드를 먼저 띄우려 하면 ★세 번째 GPU 가 없어 Pending 이 됐다.
      #
      #   1벌이 되면 GPU 한 장이 비므로 ★새 벌을 먼저 띄우고(빈 GPU 에)
      #   Ready 를 확인한 뒤 옛 벌을 내릴 수 있다 — 더 나은 무중단이다.
      maxSurge: 1
      # ★0 이다. 1 이면 옛 벌을 먼저 내려 ★그동안 받는 벌이 없어진다.
      maxUnavailable: 0
  # ⚠️1벌이므로 「두 영역에 하나씩」은 더 이상 성립하지 않는다. 대신 GPU 가 한 장
  #   비어 있어, 있던 영역이 죽으면 ★남은 영역의 GPU 노드로 스스로 옮겨 간다.
  #   GPU 노드는 2-a·2-b 에 한 대씩이다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt-worker
    spec:
      # ★저장소가 비공개다. 이게 없으면 ImagePullBackOff 로 멈춘다.
      imagePullSecrets:
        - name: catchap-registry
      # ★★nodeSelector 를 안 쓴다 — nvidia.com/gpu 를 달라고 하는 것으로 충분하다.
      #   그 자원을 가진 노드는 GPU 노드 하나뿐이라 스케줄러가 알아서 보낸다.
      #   노드 이름이나 노드풀 이름을 적으면 그것이 바뀔 때 같이 고쳐야 한다.
      #
      # ★안티어피니티도 없다 — 한 벌뿐이라 나눌 것이 없다.
      containers:
        - name: stt-worker
          # ⬜태그는 CI 가 커밋 해시로 고친다 (catchap-stt-worker 저장소의 deploy.yml)
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-ai-repo/catchap-stt-worker:66c0f47
          imagePullPolicy: IfNotPresent
          # ★★배포 중 502 를 없앤다 (2026-08-12 실측으로 넣음).
          #
          #   0804 에 "로드밸런서가 준비 안 된 파드로는 안 보내므로 끊기지 않는다" 고
          #   적어 두었는데, ★재기동 중 90번 두드려 3번 실패했다(502 둘·연결끊김 하나).
          #
          #   ★왜 끊기나 — 파드가 Terminating 이 되는 것과 인그레스가 대상 목록에서
          #     빼는 것은 ★동시가 아니다. 목록에서 빠지기 전에 프로세스가 먼저 멈추면
          #     그 사이에 온 요청이 갈 곳을 잃는다 → 502.
          #
          #   ★sleep 5 는 "잠깐 더 받아 준다" 는 뜻이다. 그동안 인그레스가 목록을
          #     갱신하고, 그 뒤에 SIGTERM 이 온다. terminationGracePeriod 30초 안이라
          #     정상 종료할 시간도 남는다.
          #
          #   ⚠️0804 에는 「maxUnavailable:0 으로는 못 고친다 — 안티어피니티와 노드
          #     2대 때문에 영원히 Pending」이라고 적혀 있었다. ★그 안티어피니티는
          #     지금 이 매니페스트에 없고, 1벌로 줄여 GPU 한 장이 비므로
          #     maxSurge:1 / maxUnavailable:0 이 성립한다(2026-08-19).
          #     preStop 은 그대로 둔다 — 끊김을 줄이는 것은 여전히 필요하다.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: stt-worker-config
            - secretRef:
                name: stt-worker-secret
          # ★★GPU 를 달라고 하는 줄이 ★이것 하나다.
          #   limits 에만 적는다 — 확장 자원은 requests 를 안 적으면 같은 값이 들어간다.
          #   ⚠️GPU 는 ★쪼갤 수 없다. 0.5 같은 값은 못 쓴다.
          #
          # ★cpu·memory 는 옛 GPU VM 에서 ★실측한 값이다 (0810, docker stats)
          #     MEM  481.1MiB (모델이 GPU 에 올라간 상태)   CPU 0.21% (대기 중)
          #     uvicorn RSS 509MB · GPU 메모리는 ★3892MiB / 15360MiB
          #   호스트 메모리를 적게 쓰는 이유는 모델이 ★GPU 에 올라가 있어서다.
          #   전사할 때 오디오 디코딩으로 잠깐 더 쓰므로 한도는 넉넉히 4Gi 로 둔다.
          #   ⚠️cpu 한도는 ★일부러 안 건다 — 한도를 걸면 전사 중에 조여져 느려진다.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              nvidia.com/gpu: 1
            limits:
              memory: "4Gi"
              nvidia.com/gpu: 1
          # ★/health 는 모델을 올리지 않는다(main.py 확인). 그래서 가볍고 빠르다.
          #   ⚠️모델은 ★첫 전사 요청 때 올라온다(lazy). 그래서 startupProbe 가 짧아도 된다 —
          #     기동 자체는 금방이고, 오래 걸리는 것은 첫 전사다.
          # ★★살아있음 검사가 ★전사 중인 파드를 죽였다 (2026-08-10 실제 장애).
          #
          #   전사는 GPU 로 ★길게 돈다. 강의 하나가 몇 분씩 걸린다.
          #   30초×3 = ★90초면 죽이도록 두었더니, 강의를 올렸을 때 전사 중에
          #   exitCode 137 로 죽고 강사님께 실패 메일이 나갔다.
          #
          #   ★진짜 원인은 코드였다 — async def 안에서 블로킹 호출을 해서
          #     이벤트 루프가 멈추고 /health 가 응답을 못 했다. 그건 고쳤다(def 로).
          #
          #   ★그래도 한도를 넉넉히 둔다. 「오래 걸리는 일」과 「먹통」을 시간만으로
          #     가르는 것이라, GPU 작업에는 여유가 필요하다.
          #     ★백엔드가 기다려 주는 시간(_WORKER_TIMEOUT_SEC = 1800초)과 맞췄다.
          #     그보다 오래 살아 있어도 어차피 백엔드가 먼저 포기한다.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60      # ★30초 × 60 = 1800초
          # ★준비됨 검사도 같은 이유로 늘린다 — 여기서 빠지면 ★다른 한 벌로 몰린다.
          #   두 벌이 다 전사 중이면 둘 다 빠져 ★서비스가 통째로 없어진다.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30      # ★10초 × 30 = 300초
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24   # 최대 2분
          securityContext:
            allowPrivilegeEscalation: false
            # ★루트 파일시스템을 잠근다. 쓰는 곳은 아래 두 군데뿐이다.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # ⚠️★root 로 돈다 — 이미지에 USER 지시가 없고, 모델 캐시 기본 경로가
            #   /root/.cache/huggingface 다. 비root 로 바꾸려면 이미지도 같이 고쳐야 해서
            #   이번 이전에서는 옛 VM 과 ★같은 조건을 유지했다.
            #   ⬜다음에 이미지를 손볼 때 비root + HF_HOME 으로 옮긴다.
          volumeMounts:
            # ★모델 캐시 볼륨이 ★없다 — 모델을 이미지에 구웠다 (0810 오후).
            #   PVC 는 가용영역에 묶여서, GPU 노드풀을 다른 AZ 에 다시 만들면
            #   파드가 영영 Pending 이 됐다. 앱 5개 중 이 워커만 디스크를 갖고
            #   있었는데, 없애서 앱 층이 다시 ★완전 무상태가 됐다.
            # ★업로드된 오디오를 잠깐 받아 두는 곳 (main.py 가 tempfile 을 쓴다)
            #   ⚠️백엔드가 영상이 아니라 ★오디오만 뽑아 보낸다(0806 수정, 11.66GB→89.1MB).
            #     그래도 여유를 두고 4Gi 로 잡는다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
