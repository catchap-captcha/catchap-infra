# ★이름이 `stt-worker` 여야 한다. 백엔드가 이 이름으로 부른다.
#     k8s/backend/10-configmap.yaml
#       STT_WORKER_URL: "http://stt-worker.catchap.svc.cluster.local:8100"
#
# ★ClusterIP = 클러스터 ★안에서만 보인다. 밖에서는 못 부른다.
#   ⚠️이것이 중요하다 — 옛 GPU VM 에서는 사설망에 8100 을 열어 두고
#     보안그룹으로 막고 있었다. 클러스터로 옮기면서 ★Ingress 에 안 붙였다.
#     전사는 백엔드만 부르고, 사용자가 직접 부를 일이 없다.
#
# ★그 위에 공유 토큰이 한 겹 더 있다 (X-Worker-Token).
#   같은 클러스터 안의 다른 파드가 실수로 불러도 401 로 막힌다.
apiVersion: v1
kind: Service
metadata:
  name: stt-worker
  namespace: catchap
  labels:
    app.kubernetes.io/name: stt-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stt-worker
  ports:
    - name: http
      port: 8100
      targetPort: http
