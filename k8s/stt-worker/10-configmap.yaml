# STT 워커 설정 — ★비밀이 아닌 값만
#
# ★비밀값은 여기 없습니다. 앱이 기동할 때 ★금고(Secrets Manager)에서 직접 읽습니다.
#   `00-아키텍처-설계.md` 2-E 에서 택한 (가) 방식이고, 백엔드·캡차·행동AI 와 같습니다.
#
#   ★열쇠 두 개(SECRETS_ACCESS_KEY·SECRETS_SECRET_KEY)만 stt-worker-secret 에 있고,
#     실제 값(STT_WORKER_TOKEN)은 ★금고에만 있습니다.
#
# ⚠️★한 번 (나) 로 갔다가 되돌린 자리입니다 (0810)
#   처음에는 「값이 하나뿐이니 K8s Secret 에 그냥 두자」고 했습니다. 근거는
#   「로더용 열쇠 하나가 금고 19건을 다 여니, 값 1개를 없애려고 큰 열쇠를 들이는 셈」
#   이었습니다. 그 말 자체는 맞지만, ★버린 쪽의 대가를 안 셌습니다.
#
#   ★이 토큰은 ★이미 금고에 있습니다 — ★백엔드가 금고에서 읽어 헤더에 실어 보냅니다.
#     K8s Secret 에도 두면 ★같은 값이 두 곳에 생깁니다. 금고에서 한 번 회전시키면
#     백엔드는 새 값을 보내는데 워커는 옛 값을 들고 있어 ★전사가 401 로 조용히 멈춥니다.
#     설계 문서가 (나) 를 버린 이유가 정확히 이것입니다 — 「두 곳을 동기화해야 함」.
#
#   ★같은 종류를 오늘 아침에 이미 고쳤습니다 — 캡차와 행동AI 가 같은 열쇠를 각자
#     갖고 있어 한쪽만 회전하면 조용히 끊기던 것을, 한 시크릿에 두 이름으로 넣어
#     구조적으로 못 어긋나게 만들었습니다. 그 판단과 어긋나지 않게 되돌렸습니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stt-worker-config
  namespace: catchap
  labels:
    app.kubernetes.io/name: stt-worker
data:
  # ★★모델을 ★이름이 아니라 ★경로로 줍니다 (0810 오후 바꿈)
  #   이미지에 구워 둔 곳입니다. faster-whisper 는 로컬 경로를 받으면
  #   HuggingFace 를 ★아예 안 부릅니다. 이름(`large-v3`)으로 두면 캐시를 찾으러 나갑니다.
  #   ⚠️전에는 PVC 에 캐시로 뒀는데 그 디스크가 ★가용영역에 묶여서,
  #     GPU 노드풀을 다른 AZ 에 다시 만들면 파드가 ★영영 Pending 이 됐습니다.
  STT_MODEL: "/opt/whisper-model"
  STT_DEVICE: "cuda"
  STT_COMPUTE: "float16"

  # ─────────────────────────────────────────────────────────────
  # 금고에서 읽기
  # ─────────────────────────────────────────────────────────────
  SECRETS_BACKEND: "kakaocloud"
  # ★무엇을 읽을지는 ★배포가 명시합니다. 프로젝트의 시크릿을 전부 긁어 오면
  #   나중에 시크릿이 하나 늘었을 때 앱 동작이 말없이 바뀝니다.
  SECRETS_NAMES: "catchap-stt-worker-token"
  SECRETS_IAM_ENDPOINT: "https://iam.kakaocloud.com/identity/v3"
  SECRETS_ENDPOINT: "https://secrets-manager-service.kr-central-2.kakaocloud.com"
  # ★★반드시 있어야 하는 변수 — 없으면 ★기동에서 죽습니다.
  #   이게 없으면 토큰이 안 들어와도 앱이 조용히 뜨고, ★빈 토큰은 인증을 통째로
  #   건너뛰기 때문에(main.py) 워커가 ★열린 채로 돕니다. 막히는 게 아니라 열립니다.
  SECRETS_REQUIRED_VARS: "STT_WORKER_TOKEN"
