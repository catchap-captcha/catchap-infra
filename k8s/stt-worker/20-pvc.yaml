# 모델 캐시를 담는 디스크
#
# ★왜 필요한가 — faster-whisper 는 처음 쓸 때 모델을 HuggingFace 에서 받아 캐시에 둔다.
#   large-v3 는 ★2.9GB 다(옛 GPU VM 에서 실측: /opt/whisper-models = 2.9G).
#
#   ⚠️emptyDir 로 두면 ★파드가 뜰 때마다 2.9GB 를 다시 받는다.
#     배포 한 번에 몇 분이 더 걸리고, 그 사이 첫 전사가 늘어진다.
#     옛 VM 도 같은 이유로 호스트 볼륨(/opt/whisper-models)을 붙여 쓰고 있었다.
#
# ★StorageClass 는 csi-cinder-sc-wait 다 — ★기본값(Immediate)을 쓰면 안 된다.
#   기본 클래스는 PVC 를 만드는 ★순간 볼륨을 만드는데, 그때는 파드가 어느 노드에
#   앉을지 모른다. 블록 스토리지는 가용영역을 넘지 못해서, 볼륨이 b 존에 생기고
#   파드가 a 존 GPU 노드에 앉으면 ★영영 못 붙는다.
#   csi-cinder-sc-wait 는 파드 자리가 정해진 뒤에 그 노드의 존에 만든다.
#   (k8s/70-storageclass-wait.yaml — 0805 에 실측으로 확인한 것)
#
# ★크기 — 지금 2.9GB 다. 모델을 바꾸거나 하나 더 받을 여지를 두고 10Gi 로 한다.
#   ⚠️PVC 는 늘릴 수는 있어도 줄일 수 없다.
#
# ★ReadWriteOnce 로 충분하다 — GPU 가 한 장이라 파드도 한 벌이다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stt-model-cache
  namespace: catchap
  labels:
    app.kubernetes.io/name: stt-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cinder-sc-wait
  resources:
    requests:
      storage: 10Gi
