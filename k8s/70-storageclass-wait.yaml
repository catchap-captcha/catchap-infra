# 파드가 앉은 자리에 디스크를 만드는 StorageClass
#
# ★왜 필요한가 — 우리 클러스터는 노드가 ★서로 다른 가용영역에 있다.
#   host-10-0-2-128  kr-central-2-a
#   host-10-0-6-202  kr-central-2-b
#
# ★카카오가 기본으로 주는 두 개(csi-cinder-sc-delete·-retain)는 volumeBindingMode 가
#   ★Immediate 다. PVC 를 만드는 ★순간에 볼륨을 만든다.
#   그런데 그때는 ★파드가 어느 노드에 앉을지 아직 모른다.
#
# ⚠️0805 실측 — Immediate 로 시험했더니 볼륨이 ★kr-central-2-b 에 생겼다.
#   파드가 a 존 노드에 앉으면 ★그 볼륨을 못 붙인다(블록 스토리지는 AZ 를 넘지 못한다).
#
# ★WaitForFirstConsumer 는 「파드가 스케줄될 때까지 기다렸다가」 그 노드의 AZ 에 만든다.
#
#   0805 실측 (같은 시험을 이 클래스로)
#     6초  PVC=Pending  파드=Pending    ← 자리가 정해지기 전
#    12초  PVC=★Bound   파드=Pending    ← 자리가 정해지자 볼륨 생성
#    18초  PVC=Bound    파드=★Running
#    파드 노드 host-10-0-2-128(a)  →  ★볼륨 zone=kr-central-2-a  (따라갔다)
#    /dev/vdb 973.4M 마운트 · 쓰기 성공
#
# ⚠️★시험할 때 걸린 함정 — 파드에 `nodeName` 을 직접 쓰면 ★스케줄러를 건너뛴다.
#   WaitForFirstConsumer 는 스케줄러가 촉발하므로 PVC 가 영원히 Pending 이다.
#   ★노드를 고정하려면 `nodeSelector` 를 쓴다.
#
# ★상태를 갖는 것(프로메테우스·그라파나)은 ★이 클래스를 쓴다.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-cinder-sc-wait
provisioner: cinder.csi.openstack.org
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
