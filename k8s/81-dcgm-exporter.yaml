# DCGM exporter — GPU 사용률을 Prometheus 가 볼 수 있게 한다 (2026-08-15)
#
# ★왜 필요한가 — nvidia-device-plugin(80-…)은 GPU 를 ★할당하는 것이고
#   ★사용률을 재지 않는다. 그래서 운영 콘솔에서 STT 워커의 GPU 칸만 비어 있었다.
#   (0815 확인: DCGM_FI_DEV_GPU_UTIL·nvidia_gpu_* 가 Prometheus 에 ★0개)
#
# ★파드별로 보려면 pod-resources 소켓이 필요하다
#   DCGM_EXPORTER_KUBERNETES=true + /var/lib/kubelet/pod-resources 를 붙여야
#   DCGM_FI_DEV_GPU_UTIL{pod="stt-worker-…"} 처럼 ★파드 라벨이 붙는다.
#   안 붙이면 노드 단위 값만 나와서 "어느 파드가 GPU 를 쓰는지" 를 알 수 없다.
#
# ★GPU 자원을 요청하지 않는다 — 요청하면 stt-worker 가 쓸 GPU 를 뺏는다.
#   DCGM 은 드라이버에 직접 붙어서 읽는다.
#
# 적용:  kubectl apply -f k8s/81-dcgm-exporter.yaml     ← ★사람이 apply (ArgoCD 밖)
# 되돌리기: kubectl delete -f k8s/81-dcgm-exporter.yaml
#
# ★0815 적용 결과 — 20초 만에 GPU 노드 2대에 뜨고 지표가 들어왔다.
#   DCGM_FI_DEV_GPU_UTIL{exported_pod="stt-worker-…", exported_namespace="catchap"}
#   DCGM_FI_DEV_FB_USED / FB_FREE  (VRAM · Tesla T4 = 14912 MiB)
#
# 🚨★쿼리할 때 pod 가 아니라 ★exported_pod 를 써야 한다
#   DCGM 이 붙인 pod 라벨이 Prometheus 가 붙이는 pod(스크레이프 대상=exporter 자신)와
#   충돌해서 ★exported_ 접두사가 붙는다. pod 로 물으면 dcgm-exporter 자신이 나온다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: dcgm-exporter}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: dcgm-exporter}
  updateStrategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dcgm-exporter}
    spec:
      # ★GPU 노드만 — 80-nvidia-device-plugin.yaml 과 같은 방식으로 고른다.
      nodeSelector:
        node.kubernetes.io/instance-type: gn1i.4xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
          env:
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities: {add: ["SYS_ADMIN"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 300m, memory: 512Mi}
          volumeMounts:
            - name: pod-gpu-resources
              readOnly: true
              mountPath: /var/lib/kubelet/pod-resources
      volumes:
        - name: pod-gpu-resources
          hostPath: {path: /var/lib/kubelet/pod-resources}
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: dcgm-exporter}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: dcgm-exporter}
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
---
# ★ServiceMonitor 로 Prometheus 가 긁게 한다.
#   71-values 에 serviceMonitorSelectorNilUsesHelmValues: false 가 있어
#   ★라벨을 안 붙여도 자동으로 잡힌다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: dcgm-exporter}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: dcgm-exporter}
  endpoints:
    - port: metrics
      interval: 30s
