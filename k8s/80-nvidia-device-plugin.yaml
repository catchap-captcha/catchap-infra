# GPU 를 파드에게 보여 주는 장치 — NVIDIA device plugin
#
# ★왜 필요한가 — GPU 노드에 드라이버가 다 깔려 있어도, 쿠버네티스는 GPU 를 ★모른다.
#   쿠버네티스가 아는 자원은 cpu·memory·ephemeral-storage 뿐이고,
#   그 밖의 장치는 「device plugin」이 kubelet 에 등록해 줘야 비로소 보인다.
#
#   0810 실측 — 노드풀을 만든 직후 상태
#     kubectl get node host-10-0-2-32 -o json | jq .status.allocatable
#       {"cpu":"16", "memory":"65741868Ki", ...}      ← ★nvidia.com/gpu 가 ★없다
#   이 상태에서는 파드가 GPU 를 ★달라고 할 방법 자체가 없다.
#
# ★카카오가 미리 넣어 준 것 / 안 넣어 준 것 (0810 노드 안에서 직접 확인)
#     ✅ 드라이버        NVRM 580.95.05 (open kernel module) · Tesla T4
#     ✅ /dev/nvidia0 · nvidia-uvm · nvidiactl
#     ✅ nvidia-container-runtime · nvidia-ctk
#     ✅ containerd 설정  default_runtime_name = "nvidia"   ← ★기본 런타임이 이미 nvidia다
#                        그래서 ★RuntimeClass 를 따로 만들 필요가 없다
#     ❌ device plugin   ← ★이 파일이 그것이다. 모자란 건 이것 하나뿐이었다
#
# ⚠️★판본을 카카오 문서대로 하면 안 된다
#   카카오 GPU 문서(tutorial/observability/nvidia-gpu-monitoring)는 helm 으로
#   ★0.12.3 을 깔라고 안내한다. 그런데 0.12.3 은 ★2022년 판이고,
#   우리 클러스터는 ★v1.33.5 다. 네 해 차이를 그대로 쓰지 않는다.
#   → 2026-08-10 기준 최신 정식판 ★v0.19.3 (2026-06-22) 을 ★못 박아 쓴다.
#      (GitHub API 로 직접 확인했다. 웹 요약은 연도를 잘못 읽어 믿지 않았다)
#
# ★helm 이 아니라 이 파일인 이유 — helm 으로 깔면 무엇이 깔렸는지가 클러스터 안에만 남는다.
#   여기 두면 git 이 정본이 되고, 다음 사람이 판본과 ★이유를 같이 본다.
#
# ⚠️★ArgoCD 가 이 파일을 안 본다
#   ArgoCD 앱은 k8s/backend · behavior-ai · captcha · frontend ★네 개뿐이다.
#   클러스터 공통 자원(50-ingress-공통 · 70-storageclass-wait 등)과 마찬가지로
#   ★사람이 kubectl apply 한다. 고쳤으면 아래 명령을 ★직접 실행해야 반영된다.
#
#     kubectl apply -f k8s/80-nvidia-device-plugin.yaml
#
# ★nodeSelector 를 「노드풀 이름」이 아니라 「인스턴스 타입」으로 건 이유
#   지금 GPU 노드풀 이름은 team1-gpu-cluster 인데, ★이름은 바뀔 수 있다.
#   (노드풀은 이름을 못 고쳐서 바꾸려면 지우고 다시 만들어야 한다)
#   인스턴스 타입은 그 풀을 다시 만들어도 같은 것을 고르면 그대로다.
#   → ★이름이 바뀌어도 이 파일은 안 고쳐도 된다.
#   ⚠️다만 GPU 인스턴스 ★타입을 바꾸면 아래 한 줄을 같이 고쳐야 한다.
#
# ★nodeSelector 가 아예 없으면 안 되나 — 안 된다.
#   원본 매니페스트에는 nodeSelector 가 없어서 ★노드 세 대 전부에 뜬다.
#   GPU 없는 노드 두 대에서는 NVML 초기화에 실패해 ★계속 죽는다(CrashLoopBackOff).
#   늘 빨간 파드가 두 개 있으면 진짜 고장을 못 알아본다.
#
# ★테인트를 안 건 이유 (0810 결정 — 「킵-대기/14」에 적었던 계획을 ★뒤집었다)
#   처음에는 GPU 노드에 nvidia.com/gpu=true:NoSchedule 테인트를 걸 생각이었다.
#   실제로 재 보고 접었다.
#     ① GPU 는 ★따로 세는 자원이다. GPU 를 달라고 하지 않은 파드는 GPU 를 못 쓴다.
#        → 「아무 파드나 올라와서 GPU 를 뺏는」 일은 애초에 안 생긴다.
#     ② ★오토스케일러가 없다(0810 확인). 노드 수가 고정이라 「비워서 끄는」 이득이 없다.
#     ③ 클러스터 사용률이 0~3% 다. 이 노드의 16코어 64GB 는 ★쓰는 편이 낫다.
#     ④ ingress-nginx 는 ★hostNetwork 데몬셋이고 tolerations 가 ★없다.
#        테인트를 걸면 이 노드에서 ★빠진다 = 로드밸런서 대상이 셋에서 둘로 준다.
#   → 얻는 것 없이 입구 하나를 잃는 셈이라 ★걸지 않는다.
#   ⚠️나중에 GPU 작업이 늘어 격리가 필요해지면 그때 건다. 아래 tolerations 는
#     그날을 위해 ★원본 그대로 남겨 뒀다(걸어도 이 파드는 계속 뜬다).
#
# ★확인하는 법
#   kubectl get nodes -o custom-columns='NAME:.metadata.name,GPU:.status.allocatable.nvidia\.com/gpu'
#     → GPU 노드에 ★1 이 보여야 한다
#
# 원본: https://github.com/NVIDIA/k8s-device-plugin  (deployments/static/nvidia-device-plugin.yml)
# 관련: 인프라-캡처/30-작업이력/0810-GPU-노드풀-device-plugin.md
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # ★GPU 노드에만 뜬다 — 위 주석의 「nodeSelector」 문단 참고
      nodeSelector:
        node.kubernetes.io/instance-type: gn1i.4xlarge
      tolerations:
      # ★지금은 테인트를 안 걸었지만, 나중에 걸어도 이 파드는 계속 뜨게 원본 그대로 둔다
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      # 이 파드가 죽으면 GPU 자체가 안 보이므로 노드 필수 부가기능으로 표시한다
      priorityClassName: "system-node-critical"
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.19.3
        name: nvidia-device-plugin-ctr
        env: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: kubelet-device-plugins-dir
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: kubelet-device-plugins-dir
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
