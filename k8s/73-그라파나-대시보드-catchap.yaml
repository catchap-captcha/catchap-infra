# 「CatChap 한눈에」 — 자주 볼 화면 하나
#
#   kubectl apply -f 73-그라파나-대시보드-catchap.yaml
#
# ★그라파나 화면에서 손으로 만들지 않고 ★매니페스트로 선언합니다.
#   화면에서 만든 대시보드는 그라파나 파드를 다시 만들면 사라질 수 있고,
#   무엇보다 ★누가 언제 왜 바꿨는지가 안 남습니다.
#
# ★어떻게 들어가나 — 그라파나 옆에 붙은 작은 프로그램(사이드카)이
#   `grafana_dashboard: "1"` 딱지가 붙은 ConfigMap 을 찾아 그라파나에 넣어 줍니다.
#   그래서 이 파일을 apply 하면 ★그라파나를 다시 띄우지 않아도 몇 초 뒤 화면에 뜹니다.
#
# ★이 파일은 손으로 고치지 말고 생성기를 고치세요 — JSON 은 쉼표 하나에 화면이 안 뜹니다.
#   생성기: 세션 작업폴더의 make_dashboard.py (내용은 00-지금하는일.md 에 요약)
#
# ⚠️지표 이름과 라벨은 0806 에 Metric Export 로 ★실제 값을 받아 확인한 것만 씁니다.
#   문서에 있는 이름이라도 실제로는 0계열인 것이 있었습니다
#   (예: mysql_threads_connected 는 없고 ★mysql_connections_count 가 맞습니다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-catchap-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"        # ★이 딱지가 있어야 사이드카가 줍습니다
data:
  catchap-overview.json: |
    {
      "uid": "catchap-overview",
      "title": "CatChap 한눈에",
      "description": "지금 서비스가 괜찮은지 한 화면에서 본다. 0806 작성.",
      "tags": [
        "catchap",
        "★자주보는화면"
      ],
      "timezone": "Asia/Seoul",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "서비스 — 지금 떠 있나",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "서비스별 떠 있는 벌 수",
          "description": "각 서비스가 몇 벌 살아 있는지. ★2가 정상입니다(건물마다 하나씩). 1이면 한 건물만 남은 것이고, 0이면 그 서비스가 죽은 것입니다.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"catchap\"}",
              "legendFormat": "{{deployment}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 9,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "text": {
              "valueSize": 36
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "최근 1시간 다시 시작한 횟수",
          "description": "★0이 정상입니다. 숫자가 오르면 그 파드가 죽고 다시 뜨기를 반복한다는 뜻입니다 — 메모리 부족(OOM)이나 오류로 죽는 중일 수 있습니다.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"catchap\"}[1h])) > 0",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 8,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "text": {
              "valueSize": 36
            }
          }
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "파드 메모리 — 제한 대비",
          "description": "★분모가 '노드 용량'이 아니라 그 파드에게 준 '메모리 제한'입니다. 100%에 닿으면 쿠버네티스가 그 파드를 죽입니다(OOMKill). 즉 이 숫자가 ★죽기까지 남은 여유입니다.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"catchap\",container!=\"\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"catchap\",resource=\"memory\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 17,
            "y": 1,
            "w": 7,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
