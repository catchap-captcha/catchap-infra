          "options": {
            "mode": "markdown",
            "content": "### 색이 뜻하는 것\n**초록** 그대로 두면 됩니다 · **노랑** 봐 둘 것 · **빨강** 지금 손대야 합니다\n\n### 여기 없는 것 두 가지\n- **GPU 사용률·VRAM** — 운영 콘솔(`/ops/monitoring`)에서 봅니다.\n  GPU 서버는 쿠버네티스 밖에 있어 프로메테우스가 걷어가지 못하고,\n  그 서버가 백엔드로 직접 밀어넣는 구조입니다.\n- **컨트롤 플레인(etcd·스케줄러 등)** — 카카오가 운영하는 부분이라 우리가 볼 수 없습니다.\n  기본 대시보드에 자리는 있지만 값이 비는 것이 정상입니다.\n\n### 관리형 지표는 프로젝트 전체가 옵니다\n데이터베이스·캐시·입구 지표는 **2조 자원까지 같은 창구로 옵니다.**\n이 화면의 모든 조회에는 우리 것만 고르는 조건이 들어 있습니다\n(`lb_name=~\"catchap-.*\"` · `instance_group_name=\"mysql-team1\"` ·\n`cluster_name=\"catchap-valkey-prod\"`).\n**직접 조회를 만들 때 이 조건을 빼면 남의 자원이 섞입니다.**\n\n### 값이 안 보일 때\n표시 기간을 **최근 30분** 이상으로 잡아 보세요. 관리형 지표는 1분 간격이라\n너무 짧은 구간에서는 점이 없을 수 있습니다."
